<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrar | Painel Luana Coin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3E9DA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Guia de Marca Luana Coin 2026: terracota chama atencao, creme areia e o respiro,
     marrom cafe e o texto. Salvia e rosa po so em detalhes. */
  :root{
    --creme:#F3E9DA;
    --card:#FBF6EC;
    --cafe:#4A2E26;
    --terracota:#B5543C;
    --terracota-escura:#9A4430;
    --rosa-po:#E8B4B0;
    --salvia:#8A9A6E;
    --sobre-terracota:#FFF8EE;
    --linha:rgba(74,46,38,.2);
    --radius:24px;
    --ff-body:'Poppins', system-ui, sans-serif;
    --ff-titulo:'Fraunces', Georgia, serif;
    --ff-assinatura:'Caveat', cursive;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 12% 8%, rgba(232,180,176,.45), transparent 42%),
      radial-gradient(circle at 92% 94%, rgba(138,154,110,.32), transparent 40%),
      var(--creme);
    font-family:var(--ff-body);
    font-weight:400;
    color:var(--cafe);
  }
  a{ color:inherit; }
  .card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border:1px solid var(--linha);
    border-radius:var(--radius);
    box-shadow:0 26px 54px -26px rgba(74,46,38,.38);
    padding:38px 30px 30px;
  }
  .saudacao{
    font-family:var(--ff-assinatura);
    font-weight:600;
    font-size:1.7rem;
    line-height:1;
    color:var(--terracota);
    margin:0 0 2px;
  }
  .brand{
    font-family:var(--ff-titulo);
    font-weight:500;
    font-size:1.7rem;
    line-height:1.15;
    letter-spacing:-.015em;
    margin:0 0 6px;
  }
  .sub{
    font-size:.88rem;
    font-weight:300;
    color:#6F554B;
    margin:0 0 26px;
  }
  label{
    display:block;
    font-size:.82rem;
    font-weight:500;
    margin-bottom:6px;
  }
  .field{ margin-bottom:16px; }
  input{
    width:100%;
    padding:11px 14px;
    font-family:inherit;
    font-size:.95rem;
    color:var(--cafe);
    border:1.5px solid var(--linha);
    border-radius:12px;
    background:var(--creme);
  }
  input:focus-visible{
    outline:2px solid var(--terracota);
    outline-offset:2px;
    border-color:var(--terracota);
  }
  button{
    width:100%;
    font-family:inherit;
    font-weight:500;
    font-size:.95rem;
    padding:13px;
    border-radius:999px;
    border:none;
    background:var(--terracota);
    color:var(--sobre-terracota);
    cursor:pointer;
    box-shadow:0 10px 22px -12px rgba(181,84,60,.7);
    transition:transform .15s ease, background .15s ease;
  }
  button:hover{ background:var(--terracota-escura); transform:translateY(-1px); }
  button:disabled{ opacity:.6; cursor:default; transform:none; }
  button:focus-visible{ outline:2px solid var(--cafe); outline-offset:3px; }
  .faixa{
    margin-top:14px;
    padding:10px 14px;
    border-radius:12px;
    font-size:.85rem;
    font-weight:500;
    display:none;
  }
  .faixa.erro{ background:#F8E1DC; color:#8A2A1E; border:1px solid #E3B1A7; display:block; }
  .faixa.ok{ background:#E3E8D3; color:#46552F; border:1px solid #B9C4A0; display:block; }
  .links{
    margin-top:18px;
    text-align:center;
    font-size:.82rem;
  }
  .links button.link{
    background:none;
    border:none;
    box-shadow:none;
    width:auto;
    padding:0;
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:3px;
    color:var(--terracota);
    font-size:.82rem;
  }
  .links button.link:hover{ transform:none; background:none; color:var(--terracota-escura); }
</style>
</head>
<body>

<div class="card">
  <p class="saudacao">bem-vinda de volta</p>
  <p class="brand">Painel Luana Coin</p>
  <p class="sub">Entre com seu e-mail e senha.</p>

  <form id="formLogin">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">
    </div>
    <button type="submit" id="btnEntrar">Entrar</button>
    <p class="faixa" id="faixa" role="status"></p>
  </form>

  <p class="links">
    <button type="button" class="link" id="btnEsqueci">Esqueci minha senha</button>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
(function(){
  "use strict";

  var form = document.getElementById("formLogin");
  var faixa = document.getElementById("faixa");
  var btnEntrar = document.getElementById("btnEntrar");
  var btnEsqueci = document.getElementById("btnEsqueci");
  var campoEmail = document.getElementById("email");
  var campoSenha = document.getElementById("senha");

  function mostrarFaixa(texto, tipo){
    faixa.textContent = texto;
    faixa.className = "faixa " + tipo;
  }

  function esconderFaixa(){
    faixa.className = "faixa";
    faixa.textContent = "";
  }

  // Se o Supabase nao carregou (internet, bloqueador de anuncios, etc), avisa
  // aqui em vez de deixar o formulario sem fazer nada quando ela clicar em Entrar.
  if(!window.banco){
    mostrarFaixa("Não consegui carregar a conexão com o banco de dados. Recarregue a página. Se continuar, verifique sua internet ou desative bloqueadores de anúncio.", "erro");
  } else {
    // Se já tiver sessão aberta, manda direto para o admin.
    banco.auth.getSession().then(function(resultado){
      if(resultado.data && resultado.data.session){
        window.location.href = "../admin/";
      }
    }).catch(function(erro){ console.error(erro); });
  }

  form.addEventListener("submit", async function(evento){
    evento.preventDefault();
    esconderFaixa();

    if(!window.banco){
      mostrarFaixa("Não consegui carregar a conexão com o banco de dados. Recarregue a página e tente de novo.", "erro");
      return;
    }

    btnEntrar.disabled = true;
    btnEntrar.textContent = "Entrando...";

    var resultado;
    try{
      resultado = await banco.auth.signInWithPassword({
        email: campoEmail.value.trim(),
        password: campoSenha.value
      });
    }catch(erro){
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
      mostrarFaixa("Não consegui falar com o banco de dados. Verifique sua internet e tente de novo.", "erro");
      return;
    }

    btnEntrar.disabled = false;
    btnEntrar.textContent = "Entrar";

    if(resultado.error){
      mostrarFaixa("E-mail ou senha incorretos.", "erro");
      return;
    }

    window.location.href = "../admin/";
  });

  btnEsqueci.addEventListener("click", async function(){
    esconderFaixa();

    if(!window.banco){
      mostrarFaixa("Não consegui carregar a conexão com o banco de dados. Recarregue a página e tente de novo.", "erro");
      return;
    }

    var email = campoEmail.value.trim();
    if(!email){
      mostrarFaixa("Digite seu e-mail no campo acima primeiro.", "erro");
      campoEmail.focus();
      return;
    }

    btnEsqueci.disabled = true;
    var resultado;
    try{
      resultado = await banco.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href
      });
    }catch(erro){
      btnEsqueci.disabled = false;
      mostrarFaixa("Não consegui falar com o banco de dados. Verifique sua internet e tente de novo.", "erro");
      return;
    }
    btnEsqueci.disabled = false;

    if(resultado.error){
      mostrarFaixa("Não consegui enviar o e-mail de recuperação. Tente de novo.", "erro");
      return;
    }

    mostrarFaixa("Enviei um e-mail de recuperação para " + email + ".", "ok");
  });
})();
</script>
</body>
</html>
