      ["Campanha","Cliente","Tipo","Status","Qtd","Valor","Prazo","Pagamento","Favorita"],
      linhas.map(function(c){
        return [c.campanha, c.cliente, c.tipo, c.status, c.qtd, c.valor, c.prazo ? formatarData(c.prazo) : "", c.pagamento, c.favorita ? "Sim" : "Não"];
      })
    );
  });

  desenharTabelaCampanhas(lista);
}

function filtrarOrdenarCampanhas(lista){
  var filtrada = lista.filter(function(c){
    if(filtroCampanhaStatus === "ativas" && !c.ativa) return false;
    if(filtroCampanhaStatus === "finalizadas" && c.ativa) return false;
    if(buscaCampanhaTexto){
      var alvo = (c.campanha + " " + c.cliente).toLowerCase();
      if(alvo.indexOf(buscaCampanhaTexto.toLowerCase()) === -1) return false;
    }
    return true;
  });

  var col = ordenacaoCampanha.coluna;
  var dir = ordenacaoCampanha.direcao === "asc" ? 1 : -1;
  filtrada.sort(function(a,b){
    var va, vb;
    if(col === "status"){
      va = STATUS_CAMPANHA.indexOf(a.status);
      vb = STATUS_CAMPANHA.indexOf(b.status);
    } else if(col === "valor" || col === "qtd"){
      va = Number(a[col] || 0);
      vb = Number(b[col] || 0);
    } else if(col === "prazo"){
      va = a.prazo ? new Date(a.prazo).getTime() : Infinity;
      vb = b.prazo ? new Date(b.prazo).getTime() : Infinity;
    } else {
      va = String(a[col] || "").toLowerCase();
      vb = String(b[col] || "").toLowerCase();
    }
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return 0;
  });
  return filtrada;
}

var COLUNAS_CAMPANHA = [
  { chave: "campanha", rotulo: "Campanha" },
  { chave: "cliente", rotulo: "Cliente" },
  { chave: "tipo", rotulo: "Tipo" },
  { chave: "status", rotulo: "Status" },
  { chave: "qtd", rotulo: "Qtd" },
  { chave: "valor", rotulo: "Valor" },
  { chave: "prazo", rotulo: "Prazo" },
  { chave: "pagamento", rotulo: "Pagamento" }
];

function desenharTabelaCampanhas(todasCampanhas){
  var area = document.getElementById("areaTabelaCampanhas");

  if(todasCampanhas.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Você ainda não tem campanhas cadastradas. Clique em "Adicionar" para criar a primeira.</div>';
    return;
  }

  var lista = filtrarOrdenarCampanhas(todasCampanhas);
  if(lista.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Nenhuma campanha encontrada com esse filtro.</div>';
    return;
  }

  var thead = '<tr><th></th>' + COLUNAS_CAMPANHA.map(function(c){
    var ativa = ordenacaoCampanha.coluna === c.chave;
    var setaTxt = ativa ? (ordenacaoCampanha.direcao === "asc" ? "▲" : "▼") : "▲";
    return '<th class="ordenavel ' + (ativa ? "ativa" : "") + '" data-coluna="' + c.chave + '">' + c.rotulo + ' <span class="seta">' + setaTxt + '</span></th>';
  }).join("") + '</tr>';

  var linhasHtml = lista.map(function(c){
    var tipoCor = TIPO_CAMPANHA_COR[c.tipo] || "#888";
    var statusCor = STATUS_CAMPANHA_COR[c.status] || "#888";
    var etiquetaPrazo = "";
    if(c.prazo && c.status !== "Entregue"){
      var diff = diasEntre(c.prazo);
      if(diff < 0) etiquetaPrazo = '<span class="etiqueta atrasado">Atrasado ' + Math.abs(diff) + 'd</span>';
      else if(diff <= 3) etiquetaPrazo = '<span class="etiqueta vence">Vence em ' + diff + 'd</span>';
    }
    return '<tr class="linha-campanha ' + (c.favorita ? "linha-favorita" : "") + '" data-id="' + c.id + '">' +
      '<td><button class="icone-olho" data-favorita="' + c.id + '" title="Destacar">' + icone(c.favorita ? "estrelaCheia" : "estrelaVazia") + '</button></td>' +
      '<td><strong>' + escapa(c.campanha) + '</strong></td>' +
      '<td>' + escapa(c.cliente) + '</td>' +
      '<td><span class="pilula" style="background:' + tipoCor + '22;color:' + tipoCor + '">' + escapa(c.tipo) + '</span></td>' +
      '<td><span class="pilula" style="background:' + statusCor + '22;color:' + statusCor + '">' + escapa(c.status) + '</span></td>' +
      '<td>' + c.qtd + '</td>' +
      '<td>' + formatarDinheiro(c.valor) + '</td>' +
      '<td>' + (c.prazo ? formatarData(c.prazo) : "-") + etiquetaPrazo + '</td>' +
      '<td><span class="pilula" style="background:' + (c.pagamento === "pago" ? "#7ea60022" : "#8a8a8a22") + ';color:' + (c.pagamento === "pago" ? "#4b8f00" : "#666") + '">' + (c.pagamento === "pago" ? "Pago" : "Pendente") + '</span></td>' +
    '</tr>';
  }).join("");

  area.innerHTML = '<table><thead>' + thead + '</thead><tbody>' + linhasHtml + '</tbody></table>';

  area.querySelectorAll("th.ordenavel").forEach(function(th){
    th.addEventListener("click", function(){
      var coluna = th.dataset.coluna;
      if(ordenacaoCampanha.coluna === coluna){
        ordenacaoCampanha.direcao = ordenacaoCampanha.direcao === "asc" ? "desc" : "asc";
      } else {
        ordenacaoCampanha.coluna = coluna;
        ordenacaoCampanha.direcao = "asc";
      }
      desenharTabelaCampanhas(todasCampanhas);
    });
  });

  area.querySelectorAll("[data-favorita]").forEach(function(botao){
    botao.addEventListener("click", async function(e){
      e.stopPropagation();
      var id = Number(botao.dataset.favorita);
      var camp = todasCampanhas.find(function(c){ return c.id === id; });
      await buscarSeguro(banco.from("campanhas").update({ favorita: !camp.favorita }).eq("id", id));
      irParaAba("campanhas");
    });
  });

  area.querySelectorAll(".linha-campanha").forEach(function(tr){
    tr.addEventListener("click", function(){
      var id = Number(tr.dataset.id);
      var camp = todasCampanhas.find(function(c){ return c.id === id; });
      abrirFormCampanha(camp);
    });
  });
}

function abrirFormCampanha(campanha){
  var editando = !!campanha;
  var opcoesTipo = ["Conteúdo","Publicidade"].map(function(t){
    var sel = editando && campanha.tipo === t ? "selected" : "";
    return '<option value="' + t + '" ' + sel + '>' + t + '</option>';
  }).join("");
  var opcoesStatus = STATUS_CAMPANHA.map(function(s){
    var sel = editando && campanha.status === s ? "selected" : "";
    return '<option value="' + s + '" ' + sel + '>' + s + '</option>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">' + (editando ? "Editar campanha" : "Adicionar campanha") + '</p>' +
    '<form id="formCampanha">' +
      '<div class="campo"><label>Nome da campanha</label><input required id="fcpCampanha" value="' + (editando ? escapa(campanha.campanha) : "") + '"></div>' +
      '<div class="campo"><label>Cliente</label><input required id="fcpCliente" value="' + (editando ? escapa(campanha.cliente) : "") + '"></div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Tipo</label><select id="fcpTipo">' + opcoesTipo + '</select></div>' +
        '<div class="campo"><label>Status</label><select id="fcpStatus">' + opcoesStatus + '</select></div>' +
      '</div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Quantidade de vídeos</label><input type="number" min="1" id="fcpQtd" value="' + (editando ? campanha.qtd : 1) + '"></div>' +
        '<div class="campo"><label>Valor total (R$)</label><input type="number" step="0.01" min="0" id="fcpValor" value="' + (editando ? campanha.valor : 0) + '"></div>' +
      '</div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Prazo</label><input type="date" id="fcpPrazo" value="' + (editando && campanha.prazo ? campanha.prazo : "") + '"></div>' +
        '<div class="campo"><label>Pagamento</label><select id="fcpPagamento"><option value="pendente" ' + (!editando || campanha.pagamento === "pendente" ? "selected" : "") + '>Pendente</option><option value="pago" ' + (editando && campanha.pagamento === "pago" ? "selected" : "") + '>Pago</option></select></div>' +
      '</div>' +
      '<div class="campo campo-check"><input type="checkbox" id="fcpAtiva" ' + (!editando || campanha.ativa ? "checked" : "") + '><label for="fcpAtiva">Ativa</label></div>' +
      '<div class="campo campo-check"><input type="checkbox" id="fcpFavorita" ' + (editando && campanha.favorita ? "checked" : "") + '><label for="fcpFavorita">Destacar com estrela</label></div>' +
      '<div class="form-acoes">' +
        (editando ? '<button type="button" class="btn btn-perigo" id="btnApagarCampanha">Apagar</button>' : '<span></span>') +
        '<button type="submit" class="btn btn-principal">Salvar</button>' +
      '</div>' +
      '<p class="aviso erro oculto" id="fcpErro"></p>' +
    '</form>',
    true
  );

  if(editando){
    document.getElementById("btnApagarCampanha").addEventListener("click", async function(){
      await buscarSeguro(banco.from("campanhas").delete().eq("id", campanha.id));
      fecharModal();
      irParaAba("campanhas");
    });
  }

  document.getElementById("formCampanha").addEventListener("submit", async function(e){
    e.preventDefault();
    var dados = {
      campanha: document.getElementById("fcpCampanha").value.trim(),
      cliente: document.getElementById("fcpCliente").value.trim(),
      tipo: document.getElementById("fcpTipo").value,
      status: document.getElementById("fcpStatus").value,
      qtd: Number(document.getElementById("fcpQtd").value || 1),
      valor: Number(document.getElementById("fcpValor").value || 0),
      prazo: document.getElementById("fcpPrazo").value || null,
      pagamento: document.getElementById("fcpPagamento").value,
      ativa: document.getElementById("fcpAtiva").checked,
      favorita: document.getElementById("fcpFavorita").checked
    };
    var res = editando
      ? await buscarSeguro(banco.from("campanhas").update(dados).eq("id", campanha.id))
      : await buscarSeguro(banco.from("campanhas").insert(dados));

    if(!res.ok){
      var erroEl = document.getElementById("fcpErro");
      erroEl.textContent = "Não consegui salvar: " + res.mensagem;
      erroEl.classList.remove("oculto");
      return;
    }
    fecharModal();
    irParaAba("campanhas");
  });
}

var checklistSubaba = "referencias";

async function abaChecklist(painel){
  if(!window.Biblioteca){
    painel.innerHTML = faixaAviso("Não encontrei o arquivo js/biblioteca.js. Confira se ele foi salvo dentro da pasta js do seu projeto.", "erro");
    return;
  }

  var subabas = [
    { chave: "referencias", rotulo: "Referências de vídeo" },
    { chave: "roteiros", rotulo: "Roteiros" },
    { chave: "nichos", rotulo: "Ideias por nicho" },
    { chave: "revisao", rotulo: "Revisar meu roteiro" }
  ];

  var html = '<div class="subtabs">' + subabas.map(function(s){
    return '<button type="button" class="subtab-btn ' + (checklistSubaba === s.chave ? "ativo" : "") + '" data-sub="' + s.chave + '">' + s.rotulo + '</button>';
  }).join("") + '</div>';
  html += '<div id="areaSubaba"></div>';

  painel.innerHTML = html;

  document.querySelectorAll(".subtab-btn").forEach(function(botao){
    botao.addEventListener("click", function(){ checklistSubaba = botao.dataset.sub; irParaAba("checklist"); });
  });

  var area = document.getElementById("areaSubaba");
  if(checklistSubaba === "referencias") await desenharSubReferencias(area);
  else if(checklistSubaba === "roteiros") desenharSubRoteiros(area);
  else if(checklistSubaba === "nichos") await desenharSubNichos(area);
  else if(checklistSubaba === "revisao") desenharSubRevisao(area);
}

var CORES_CARTAO = ["#2b6fff", "#ff6a2b", "#c3f53a", "#ff3da6"];
var CATEGORIAS_REFERENCIA = ["React", "Encenação", "Demonstração", "Problema e solução", "Entrevista", "Rotina"];

async function desenharSubReferencias(area){
  area.innerHTML = '<p class="vazio-explicacao">Carregando...</p>';

  var resExtras = await buscarSeguro(banco.from("referencias_video").select("*").order("created_at", { ascending: false }));
  var refsBase = window.Biblioteca.REFERENCIAS || [];
  var refsExtras = resExtras.ok ? resExtras.dados.map(function(r){
    return { id: r.id, titulo: r.titulo, emoji: r.emoji || "🎬", estilo: r.categoria, duracao: r.duracao, marca: r.marca, youtube: r.link };
  }) : [];
  var refs = refsBase.concat(refsExtras);

  var html = "";
  if(!resExtras.ok) html += faixaAviso("Não consegui carregar os vídeos que você adicionou. Confira se a tabela existe no seu Supabase (veja o arquivo sql-brainstorm.sql).", "erro");
  html += '<div class="barra-acoes"><span></span><button type="button" class="btn btn-principal" id="btnNovaReferencia">' + icone("mais") + ' Adicionar vídeo</button></div>';
  html += '<div class="grade-referencias">';
  refs.forEach(function(r, idx){
    var cor = CORES_CARTAO[idx % CORES_CARTAO.length];
    html += '<button type="button" class="cartao-ref" data-ref="' + idx + '">' +
      '<div class="capa-ref" style="background:' + cor + '33;">' + (r.emoji||"") + '</div>' +
      '<div class="info-ref"><div class="titulo-ref">' + escapa(r.titulo) + '</div><div class="meta-ref">' + escapa(r.estilo||"") + (r.duracao ? ' · ' + escapa(r.duracao) : "") + (r.marca ? " · " + escapa(r.marca) : "") + '</div></div>' +
    '</button>';
  });
  html += '</div>';
  area.innerHTML = html;

  area.querySelectorAll("[data-ref]").forEach(function(botao){
    var idx = Number(botao.dataset.ref);
    botao.addEventListener("click", function(){
      if(idx < refsBase.length) abrirDetalheReferencia(refs[idx]);
      else abrirDetalheReferenciaExtra(refs[idx]);
    });
  });

  document.getElementById("btnNovaReferencia").addEventListener("click", function(){ abrirModalNovaReferencia(); });
}

    (r.youtube ? '<a class="btn btn-principal" href="' + escapa(r.youtube) + '" target="_blank" rel="noopener">' + icone("play") + ' Assistir</a>' : '<span></span>') +
  '</div>';

async function desenharSubNichos(area){
  area.innerHTML = '<p class="vazio-explicacao">Carregando...</p>';

  var nichos = window.Biblioteca.NICHOS || [];
  var resExtras = await buscarSeguro(banco.from("ideias_nicho").select("*").order("created_at", { ascending: false }));
  var extrasPorNicho = {};
  if(resExtras.ok){
    resExtras.dados.forEach(function(i){
      if(!extrasPorNicho[i.nicho]) extrasPorNicho[i.nicho] = [];
      extrasPorNicho[i.nicho].push(i);
    });
  }

  var html = "";
  if(!resExtras.ok) html += faixaAviso("Não consegui carregar as ideias que você adicionou. Confira se a tabela existe no seu Supabase (veja o arquivo sql-brainstorm.sql).", "erro");
  html += '<div class="barra-acoes"><span></span><button type="button" class="btn btn-principal" id="btnNovaIdeia">' + icone("mais") + ' Nova ideia</button></div>';

  nichos.forEach(function(n){
    html += '<div class="nicho-bloco"><h3>' + (n.emoji||"") + ' ' + escapa(n.nome) + '</h3>';
    (n.ideias||[]).forEach(function(i){
      html += '<div class="ideia-card"><div class="t">' + escapa(i.t) + '</div><div class="gancho">"' + escapa(i.gancho) + '"</div></div>';
    });
    (extrasPorNicho[n.nome] || []).forEach(function(i){
      html += '<div class="ideia-card" style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">' +
        '<div><div class="t">' + escapa(i.titulo) + '</div>' + (i.descricao ? '<div class="gancho">"' + escapa(i.descricao) + '"</div>' : "") + '</div>' +
        '<button type="button" class="btn btn-pequeno btn-perigo" data-apagar-ideia="' + i.id + '">' + icone("lixeira") + '</button>' +
      '</div>';
    });
    html += '</div>';
  });

  area.innerHTML = html;

  document.getElementById("btnNovaIdeia").addEventListener("click", function(){ abrirModalNovaIdeia(); });
  area.querySelectorAll("[data-apagar-ideia]").forEach(function(botao){
    botao.addEventListener("click", async function(){
      if(!window.confirm("Apagar essa ideia? Isso não pode ser desfeito.")) return;
      await buscarSeguro(banco.from("ideias_nicho").delete().eq("id", botao.dataset.apagarIdeia));
      irParaAba("checklist");
    });
  });
}

    if(!titulo) return;
    var dados = {
      titulo: titulo,
      descricao: document.getElementById("ideiaDescricao").value.trim() || null,

    };

    if(!res.ok){
      var erroEl = document.getElementById("ideiaErro");
      erroEl.textContent = "Não consegui salvar: " + res.mensagem;
      erroEl.classList.remove("oculto");
      return;
    }
    fecharModal();
    checklistSubaba = "nichos";
    irParaAba("checklist");
  });
}

function desenharSubRevisao(area){
  var blocos = window.Biblioteca.REVISAO || [];
  var html = '<div class="revisao-grade">';
  html += '<div><p class="painel-titulo">Cole seu roteiro aqui</p><textarea id="campoRoteiroRevisao" style="width:100%; min-height:300px; border:1.5px solid #e0d9c6; border-radius:8px; padding:10px;" placeholder="Cole aqui o roteiro que você escreveu"></textarea></div>';
  html += '<div>';
  blocos.forEach(function(b, idxB){
    html += '<div class="revisao-bloco"><h3>' + (b.emoji||"") + ' ' + escapa(b.bloco) + '</h3>';
    (b.itens||[]).forEach(function(it, idxI){
      html += '<label class="item-checklist"><input type="checkbox"><span><span class="t">' + escapa(it.t) + '</span><br><span class="d">' + escapa(it.d) + '</span></span></label>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  area.innerHTML = html;
}

/* ============================================================================
   SESSÃO / LOGIN / SAIR
============================================================================ */
// Se algo impedir o painel de abrir (banco fora do ar, internet, CDN
// bloqueada, etc), mostra um aviso claro no lugar do "Carregando..." que
// ficaria preso na tela para sempre.
function mostrarErroCarregamento(mensagem){
  var tela = document.getElementById("telaCarregando");
  if(!tela) return;
  tela.innerHTML =
    '<div style="max-width:380px; text-align:center; padding:24px;">' +
      '<p style="font-weight:700; margin-bottom:8px;">Não consegui abrir o painel</p>' +
      '<p style="font-size:.85rem; color:#666; margin-bottom:16px;">' + mensagem + '</p>' +
      '<button onclick="window.location.reload()" style="font-family:inherit; font-weight:700; font-size:.82rem; padding:9px 18px; border-radius:999px; border:1.5px solid #111; background:#c3f53a; cursor:pointer;">Tentar de novo</button>' +
    '</div>';
}

async function iniciar(){
  try{
    if(!window.banco){
      mostrarErroCarregamento("Não consegui carregar a conexão com o banco de dados (Supabase). Verifique sua internet e clique em tentar de novo. Se continuar, veja se algum bloqueador de anúncios ou extensão do navegador não está travando o carregamento.");
      return;
    }

    // Se a verificação de login demorar demais (mais de 10 segundos),
    // mostra o aviso em vez de deixar a tela presa em "Carregando...".
    var resultado = await Promise.race([
      banco.auth.getSession(),
      new Promise(function(_, rejeitar){
        setTimeout(function(){ rejeitar(new Error("Demorou demais para responder")); }, 10000);
      })
    ]);
    var sessao = resultado.data && resultado.data.session;

    if(!sessao){
      window.location.href = "../login/";
      return;
    }

    document.getElementById("emailUsuaria").textContent = sessao.user.email;
    document.getElementById("btnSair").innerHTML = icone("sair") + "Sair";
    document.getElementById("btnSair").addEventListener("click", async function(){
      await banco.auth.signOut();
      window.location.href = "../login/";
    });

    banco.auth.onAuthStateChange(function(evento){
      if(evento === "SIGNED_OUT"){
        window.location.href = "../login/";
      }
    });

    document.body.classList.remove("carregando");
    document.getElementById("telaCarregando").hidden = true;
    document.getElementById("app").hidden = false;

    irParaAba("portfolio");
  }catch(erro){
    console.error(erro);
    mostrarErroCarregamento("Algo deu errado ao verificar seu login (" + (erro && erro.message ? erro.message : "erro desconhecido") + "). Clique em tentar de novo. Se continuar, confira sua internet.");
  }
}

iniciar();
</script>
