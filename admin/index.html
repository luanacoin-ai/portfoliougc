<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel | Luana Coin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe4;
    --paper-2:#eee6d6;
    --black:#111111;
    --blue:#2b6fff;
    --orange:#ff6a2b;
    --lime:#c3f53a;
    --magenta:#ff3da6;
    --white:#ffffff;
    --cinza:#8a8a8a;
    --vermelho:#e5484d;
    --radius:10px;
    --ff:'Poppins', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--ff);
    font-size:14px;
    color:var(--black);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:.9rem; }
  h1,h2,h3{ margin:0; font-weight:700; }
  p{ margin:0; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#d8cfba; border-radius:99px; }

  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }

  #telaCarregando{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.9rem;
    color:#666;
  }

  /* ---------- layout geral ---------- */
  #app{ display:flex; min-height:100vh; }
  #app[hidden]{ display:none; }

  #sidebar{
    width:220px;
    min-width:220px;
    background:var(--white);
    border-right:2px solid var(--black);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .sidebar-topo{
    padding:18px 18px 14px;
    font-weight:700;
    font-size:.95rem;
    border-bottom:1px solid #e6e0d0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sidebar-topo .bolinha{
    width:26px; height:26px; border-radius:50%;
    background:var(--black); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-size:.75rem; font-weight:700;
  }
  nav.menu{ flex:1; overflow-y:auto; padding:10px 10px; }
  .grupo-label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#9a9282;
    font-weight:600;
    margin:14px 10px 6px;
  }
  .grupo-label:first-child{ margin-top:2px; }
  .item-menu{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:none;
    background:none;
    border-radius:8px;
    font-size:.85rem;
    font-weight:500;
    color:var(--black);
    text-align:left;
    margin-bottom:2px;
  }
  .item-menu:hover{ background:#f2ece0; }
  .item-menu.ativo{
    background:rgba(43,111,255,.12);
    color:var(--blue);
    font-weight:700;
  }
  .item-menu svg{ width:18px; height:18px; flex-shrink:0; }
  .sidebar-rodape{
    border-top:1px solid #e6e0d0;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sidebar-rodape .email{
    font-size:.72rem;
    color:#8a8272;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #btnSair{
    display:flex;
    align-items:center;
    gap:8px;
    border:1.5px solid var(--black);
    background:var(--white);
    border-radius:8px;
    padding:7px 10px;
    font-size:.78rem;
    font-weight:600;
  }
  #btnSair:hover{ background:#f2ece0; }
  #btnSair svg{ width:15px; height:15px; }

  #btnMenuMobile{
    display:none;
    position:fixed;
    top:12px; left:12px;
    z-index:50;
    width:38px; height:38px;
    border-radius:8px;
    border:2px solid var(--black);
    background:var(--white);
  }
  #overlayMobile{
    display:none;
    position:fixed; inset:0;
    background:rgba(17,17,17,.4);
    z-index:39;
  }
  #overlayMobile.aberto{ display:block; }

  @media (max-width: 880px){
    #btnMenuMobile{ display:flex; align-items:center; justify-content:center; }
    #sidebar{
      position:fixed;
      left:-240px;
      top:0;
      z-index:40;
      transition:left .2s ease;
      box-shadow:6px 0 20px rgba(0,0,0,.15);
    }
    #sidebar.aberta{ left:0; }
    #conteudo{ padding-top:64px !important; }
  }

  #conteudo{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .cabecalho-aba{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
  }
  .cabecalho-aba h1{ font-size:1.25rem; }

  .aviso{
    border:1.5px solid #f0c04a;
    background:#fff6de;
    color:#6b4e00;
    border-radius:8px;
    padding:10px 14px;
    font-size:.8rem;
    margin-bottom:16px;
  }
  .aviso.erro{ border-color:var(--vermelho); background:#fdeaea; color:#8f1d20; }
  .vazio-explicacao{
    border:1.5px dashed #cfc5ac;
    border-radius:10px;
    padding:20px;
    text-align:center;
    font-size:.82rem;
    color:#7a7360;
  }

  /* ---------- cartões / grade ---------- */
  .grade-cartoes{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .cartao{
    background:var(--white);
    border:1.5px solid #e6e0d0;
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .cartao .numero{ font-size:1.5rem; font-weight:700; }
  .cartao .rotulo{ font-size:.74rem; color:#8a8272; margin-top:2px; }
  .cartao .sub{ font-size:.72rem; color:#8a8272; margin-top:4px; }

  .painel-branco{
    background:var(--white);
    border:1.5px solid #e6e0d0;
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:20px;
  }
  .painel-titulo{
    font-size:.85rem;
    font-weight:700;
    margin-bottom:12px;
  }

  /* ---------- botões ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:.8rem;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid var(--black);
    background:var(--white);
    color:var(--black);
  }
  .btn:hover{ background:#f2ece0; }
  .btn svg{ width:14px; height:14px; }
  .btn-principal{ background:var(--lime); }
  .btn-principal:hover{ background:#b3e02e; }
  .btn-perigo{ border-color:var(--vermelho); color:var(--vermelho); }
  .btn-perigo:hover{ background:#fdeaea; }
  .btn-pequeno{ padding:5px 10px; font-size:.72rem; }
  .btn-icone{
    width:30px; height:30px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }

  .barra-acoes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .barra-acoes .campo-busca{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:6px;
    border:1.5px solid #e6e0d0;
    border-radius:999px;
    padding:6px 12px;
    background:var(--paper);
  }
  .barra-acoes .campo-busca svg{ width:14px; height:14px; opacity:.6; }
  .barra-acoes .campo-busca input{
    border:none; background:none; outline:none; width:100%; font-size:.82rem;
  }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    padding:6px 12px;
    border-radius:999px;
    border:1.5px solid #e6e0d0;
    font-size:.75rem;
    font-weight:600;
    background:var(--white);
  }
  .chip.ativo{ background:var(--black); color:var(--white); border-color:var(--black); }

  /* ---------- tabelas ---------- */
  table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  th, td{ text-align:left; padding:9px 10px; border-bottom:1px solid #efe9db; }
  th{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:#8a8272;
    font-weight:700;
    white-space:nowrap;
  }
  th.ordenavel{ cursor:pointer; user-select:none; }
  th.ordenavel .seta{ opacity:.25; font-size:.7rem; margin-left:3px; }
  th.ordenavel.ativa .seta{ opacity:1; color:var(--blue); }
  tbody tr:hover{ background:#faf7ef; }
  tbody tr.clicavel{ cursor:pointer; }
  .tabela-scroll{ overflow-x:auto; }

  .pilula{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:.7rem;
    font-weight:700;
    white-space:nowrap;
  }
  .etiqueta{
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    font-size:.68rem;
    font-weight:700;
    margin-left:6px;
  }
  .etiqueta.atrasado{ background:#fdeaea; color:var(--vermelho); }
  .etiqueta.vence{ background:#fff6de; color:#8a6400; }

  .linha-favorita{ box-shadow: inset 3px 0 0 var(--magenta); }

  .acoes-linha{ display:flex; gap:4px; }

  /* ---------- olho / drag ---------- */
  .icone-olho{ background:none; border:none; padding:4px; display:flex; }
  .icone-olho svg{ width:17px; height:17px; }
  .alcinha{ cursor:grab; color:#b7ae98; display:flex; }
  .alcinha svg{ width:16px; height:16px; }
  tr.arrastando{ opacity:.4; }

  /* ---------- modal ---------- */
  #modalOverlay{
    position:fixed; inset:0;
    background:rgba(17,17,17,.5);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    z-index:100;
  }
  #modalOverlay[hidden]{ display:none; }
  #modalBox{
    background:var(--white);
    border-radius:14px;
    max-width:520px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
    position:relative;
  }
  #modalBox.largo{ max-width:680px; }
  #modalFechar{
    position:absolute;
    top:14px; right:14px;
    width:30px; height:30px;
    border-radius:50%;
    border:1.5px solid var(--black);
    background:var(--white);
  }
  #modalFechar svg{ width:14px; height:14px; }
  .form-titulo{ font-size:1rem; font-weight:700; margin-bottom:16px; padding-right:30px; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:.76rem; font-weight:700; margin-bottom:5px; }
  .campo input, .campo select, .campo textarea{
    width:100%;
    border:1.5px solid #e0d9c6;
    border-radius:8px;
    padding:9px 10px;
    background:var(--paper);
  }
  .campo textarea{ min-height:80px; resize:vertical; }
  .campo-check{ display:flex; align-items:center; gap:8px; }
  .campo-check input{ width:auto; }
  .form-linha{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-acoes{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; }

  /* ---------- gráfico simples de barras ---------- */
  .grafico-barras{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:110px;
    padding-top:10px;
  }
  .grafico-barras .barra-dia{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:4px;
  }
  .grafico-barras .barra{
    width:100%;
    max-width:22px;
    background:var(--blue);
    border-radius:4px 4px 0 0;
    min-height:2px;
  }
  .grafico-barras .rotulo-dia{ font-size:.6rem; color:#8a8272; white-space:nowrap; }

  /* ---------- calendário ---------- */
  .cal-topo{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav .mes-atual{ font-weight:700; font-size:.95rem; min-width:150px; text-align:center; text-transform:capitalize; }
  .cal-grade{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#e6e0d0; border:1px solid #e6e0d0; border-radius:10px; overflow:hidden; }
  .cal-dia-semana{ background:var(--paper-2); text-align:center; font-size:.68rem; font-weight:700; padding:6px 0; text-transform:uppercase; color:#8a8272; }
  .cal-cel{ background:var(--white); min-height:96px; padding:6px; position:relative; display:flex; flex-direction:column; gap:3px; }
  .cal-cel.fora{ background:#faf8f2; color:#c7bfa9; }
  .cal-cel.hoje{ box-shadow:inset 0 0 0 2px var(--blue); }
  .cal-cel .num-dia{ font-size:.72rem; font-weight:700; }
  .cal-cel .btn-add-dia{
    position:absolute; top:4px; right:4px;
    width:18px; height:18px; border-radius:5px;
    border:1px solid var(--black); background:var(--white);
    display:none; align-items:center; justify-content:center; padding:0;
  }
  .cal-cel:hover .btn-add-dia{ display:flex; }
  .cal-cel .btn-add-dia svg{ width:10px; height:10px; }
  .cal-item{
    font-size:.64rem;
    font-weight:600;
    padding:2px 5px;
    border-radius:5px;
    background:#eef2ff;
    color:var(--black);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .cal-item.tipo-gravar{ background:rgba(43,111,255,.15); }
  .cal-item.tipo-editar{ background:rgba(255,106,43,.18); }
  .cal-item.tipo-postar{ background:rgba(255,61,166,.15); }
  .cal-item.tipo-prazo{ background:rgba(17,17,17,.08); font-style:italic; }
  .cal-item.feito{ text-decoration:line-through; opacity:.55; }
  .cal-mais{ font-size:.63rem; font-weight:700; color:var(--blue); background:none; border:none; text-align:left; padding:0 5px; }

  @media (max-width:700px){
    .cal-grade{ grid-template-columns:repeat(7,1fr); }
    .cal-cel{ min-height:64px; font-size:.9em; }
    .cal-dia-semana{ font-size:.55rem; }
  }

  .bloco-atrasados .item-atrasado{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:8px; background:#fdeaea; margin-bottom:6px; font-size:.78rem;
  }

  /* ---------- checklist ---------- */
  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1.5px solid #e6e0d0; padding-bottom:10px; }
  .subtab-btn{
    padding:7px 14px; border-radius:999px; border:1.5px solid #e6e0d0; background:var(--white); font-size:.78rem; font-weight:600;
  }
  .subtab-btn.ativo{ background:var(--blue); border-color:var(--blue); color:var(--white); }

  .barra-progresso{ height:7px; border-radius:99px; background:#eee5d2; overflow:hidden; }
  .barra-progresso > div{ height:100%; background:var(--lime); }

  .secao-checklist{ border:1.5px solid #e6e0d0; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .secao-checklist summary{
    list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:10px; justify-content:space-between;
  }
  .secao-checklist summary::-webkit-details-marker{ display:none; }
  .secao-checklist .titulo-secao{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:.85rem; }
  .secao-checklist .progresso-secao{ display:flex; align-items:center; gap:8px; font-size:.7rem; color:#8a8272; min-width:130px; }
  .secao-checklist .progresso-secao .barra-progresso{ width:70px; }
  .secao-checklist .corpo-secao{ padding:0 16px 16px; }
  .secao-checklist .porque{ font-size:.78rem; color:#6b6353; margin-bottom:12px; }
  .item-checklist{ display:flex; gap:10px; padding:8px 0; border-top:1px solid #f1ecdf; }
  .item-checklist:first-child{ border-top:none; }
  .item-checklist input{ margin-top:3px; width:16px; height:16px; }
  .item-checklist .t{ font-size:.82rem; font-weight:600; }
  .item-checklist .d{ font-size:.74rem; color:#8a8272; margin-top:2px; }

  .grade-referencias{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:14px; }
  .cartao-ref{ border:1.5px solid #e6e0d0; border-radius:10px; overflow:hidden; background:var(--white); text-align:left; }
  .cartao-ref .capa-ref{
    aspect-ratio:9/16; display:flex; align-items:center; justify-content:center; font-size:2rem;
  }
  .cartao-ref .info-ref{ padding:10px 12px; }
  .cartao-ref .titulo-ref{ font-size:.8rem; font-weight:700; margin-bottom:3px; }
  .cartao-ref .meta-ref{ font-size:.68rem; color:#8a8272; }

  .bloco-tempo{ border-left:2px solid var(--blue); padding:6px 0 6px 12px; margin-bottom:8px; font-size:.8rem; }
  .bloco-tempo .t{ font-size:.68rem; font-weight:700; color:var(--blue); margin-bottom:2px; }

  .tipo-roteiro{ border:1.5px solid #e6e0d0; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .tipo-roteiro summary{ list-style:none; cursor:pointer; padding:12px 14px; font-weight:700; font-size:.85rem; display:flex; gap:10px; align-items:center; }
  .tipo-roteiro summary::-webkit-details-marker{ display:none; }
  .tipo-roteiro .corpo{ padding:0 16px 16px; }

  .nicho-bloco{ margin-bottom:18px; }
  .nicho-bloco h3{ font-size:.9rem; margin-bottom:8px; }
  .ideia-card{ border:1.5px solid #e6e0d0; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .ideia-card .t{ font-weight:700; font-size:.8rem; }
  .ideia-card .gancho{ font-size:.76rem; color:#6b6353; margin-top:3px; font-style:italic; }

  .revisao-grade{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:900px){ .revisao-grade{ grid-template-columns:1fr; } }
  .revisao-bloco{ border:1.5px solid #e6e0d0; border-radius:10px; padding:14px; margin-bottom:12px; }
  .revisao-bloco h3{ font-size:.82rem; margin-bottom:8px; }

  .oculto{ display:none !important; }
</style>
</head>
<body class="carregando">

<div id="telaCarregando">Carregando painel...</div>

<div id="app" hidden>

  <button id="btnMenuMobile" aria-label="Abrir menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="overlayMobile"></div>

  <aside id="sidebar">
    <div class="sidebar-topo">
      <span class="bolinha">LC</span>
      Painel Luana Coin
    </div>
    <nav class="menu">
      <p class="grupo-label">meu site</p>
      <button class="item-menu" data-tab="portfolio"></button>
      <button class="item-menu" data-tab="marcas"></button>
      <p class="grupo-label">minha rotina</p>
      <button class="item-menu" data-tab="calendario"></button>
      <button class="item-menu" data-tab="campanhas"></button>
      <button class="item-menu" data-tab="checklist"></button>
    </nav>
    <div class="sidebar-rodape">
      <span class="email" id="emailUsuaria"></span>
      <button id="btnSair" type="button"></button>
    </div>
  </aside>

  <main id="conteudo">
    <div class="cabecalho-aba">
      <h1 id="tituloAba">Portfólio</h1>
    </div>
    <div id="painelAba"></div>
  </main>

</div>

<div id="modalOverlay" hidden>
  <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTituloLabel">
    <button id="modalFechar" aria-label="Fechar"></button>
    <div id="modalConteudo"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script src="../js/biblioteca.js"></script>
<script>
"use strict";

/* ============================================================================
   ÍCONES (traço simples, sem emoji)
============================================================================ */
var ICONES = {
  portfolio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>',

/* ============================================================================
   AJUDANTES GERAIS
============================================================================ */
function el(html){
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapa(texto){
  if(texto === null || texto === undefined) return "";
  var d = document.createElement("div");
  d.textContent = String(texto);
  return d.innerHTML;
}

function formatarData(dataTexto){
  if(!dataTexto) return "";
  var partes = dataTexto.split("-");
  if(partes.length !== 3) return dataTexto;
  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

function formatarDinheiro(valor){
  var n = Number(valor || 0);
  return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function diasEntre(dataTexto){
  var hoje = new Date();
  hoje.setHours(0,0,0,0);
  var alvo = new Date(dataTexto + "T00:00:00");
  var diff = Math.round((alvo - hoje) / 86400000);
  return diff;
}

function somenteDigitos(texto){
  return String(texto || "").replace(/\D/g, "");
}

function linkWhatsapp(telefone){
  var digitos = somenteDigitos(telefone);
  if(!digitos) return null;
  if(digitos.length <= 11) digitos = "55" + digitos;
  return "https://wa.me/" + digitos;
}

function linkInstagram(usuario){
  if(!usuario) return null;
  var limpo = String(usuario).replace("@", "").trim();
  if(!limpo) return null;
  return "https://instagram.com/" + limpo;
}

function baixarCSV(nomeArquivo, colunas, linhas){
  var conteudo = colunas.map(function(c){ return '"' + c.replace(/"/g,'""') + '"'; }).join(";") + "\r\n";
  linhas.forEach(function(linha){
    conteudo += linha.map(function(valor){
      valor = valor === null || valor === undefined ? "" : String(valor);
      return '"' + valor.replace(/"/g,'""') + '"';
    }).join(";") + "\r\n";
  });
  var blob = new Blob(["﻿" + conteudo], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Busca segura: nunca deixa um erro de uma tabela quebrar o painel inteiro.
async function buscarSeguro(promessa){
  try{
    var resultado = await promessa;
    if(resultado.error) throw resultado.error;
    return { ok: true, dados: resultado.data || [] };
  }catch(erro){
    console.error(erro);
    return { ok: false, dados: [], mensagem: erro && erro.message ? erro.message : "Erro desconhecido" };
  }
}

function faixaAviso(texto, tipo){
  return '<p class="aviso ' + (tipo || "") + '">' + escapa(texto) + "</p>";
}

async function abaPortfolio(painel){
  var resVideos = await buscarSeguro(banco.from("videos").select("*").order("ordem", { ascending: true }));
  var resVisitas = await buscarSeguro(banco.from("visitas").select("*").order("data", { ascending: false }).limit(3000));

  var html = "";
  if(!resVideos.ok) html += faixaAviso("Não consegui carregar a tabela de vídeos. Confira se ela existe no seu Supabase (veja o arquivo banco.sql).", "erro");
  if(!resVisitas.ok) html += faixaAviso("Não consegui carregar a tabela de visitas. Confira se ela existe no seu Supabase (veja o arquivo banco.sql).", "erro");

  var videos = resVideos.dados;
  var visitas = resVisitas.dados;

  // ---- métricas da faixa superior ----
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var ha14dias = new Date(hoje.getTime() - 13*86400000);

  var visitas14 = visitas.filter(function(v){ return new Date(v.data) >= ha14dias; });
  var visitasHoje = visitas.filter(function(v){ var d = new Date(v.data); return d >= hoje; });
  var videosNoAr = videos.filter(function(v){ return v.visivel; }).length;

  var contagemNicho = {};
  videos.filter(function(v){ return v.visivel; }).forEach(function(v){
    if(!v.nicho) return;
    contagemNicho[v.nicho] = (contagemNicho[v.nicho] || 0) + 1;
  });
  var nichoMaisForte = "-";
  var maiorNicho = 0;
  Object.keys(contagemNicho).forEach(function(n){
    if(contagemNicho[n] > maiorNicho){ maiorNicho = contagemNicho[n]; nichoMaisForte = n; }
  });

  var contagemOrigem = {};
  visitas.forEach(function(v){
    var origem = v.origem && v.origem.trim() ? v.origem.trim() : "Direto";
    contagemOrigem[origem] = (contagemOrigem[origem] || 0) + 1;
  });
  var origemTop = "-";
  var maiorOrigem = 0;
  Object.keys(contagemOrigem).forEach(function(o){
    if(contagemOrigem[o] > maiorOrigem){ maiorOrigem = contagemOrigem[o]; origemTop = o; }
  });

  html += '<div class="grade-cartoes">' +
    '<div class="cartao"><div class="numero">' + visitas14.length + '</div><div class="rotulo">visitas em 14 dias</div></div>' +
    '<div class="cartao"><div class="numero">' + visitasHoje.length + '</div><div class="rotulo">visitas hoje</div></div>' +
    '<div class="cartao"><div class="numero">' + videosNoAr + '</div><div class="rotulo">vídeos no ar</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.1rem">' + escapa(nichoMaisForte) + '</div><div class="rotulo">nicho mais forte</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.1rem">' + escapa(origemTop) + '</div><div class="rotulo">de onde mais vêm</div></div>' +
    '</div>';

  // ---- gráfico 14 dias + origens ----
  html += '<div class="painel-branco" style="display:grid; grid-template-columns:1.4fr 1fr; gap:24px;" id="blocoGraficos">';
  html += '<div><p class="painel-titulo">Visitas nos últimos 14 dias</p><div id="areaGrafico"></div></div>';
  html += '<div><p class="painel-titulo">De onde as pessoas chegaram</p><div id="areaOrigens"></div></div>';
  html += '</div>';

  // ---- tabela de vídeos ----
  html += '<div class="barra-acoes"><button class="btn btn-principal" id="btnNovoVideo">' + icone("mais") + ' Adicionar vídeo</button></div>';

  if(videos.length === 0){
    html += '<div class="vazio-explicacao">Você ainda não tem vídeos cadastrados. Clique em "Adicionar vídeo" para criar o primeiro.</div>';
  } else {
    html += '<div class="painel-branco"><div class="tabela-scroll"><table><thead><tr>' +
      '<th></th><th>Vídeo</th><th>Nicho</th><th>Marca</th><th>Destaque</th><th>Visível</th><th></th>' +
      '</tr></thead><tbody id="corpoTabelaVideos"></tbody></table></div></div>';
  }

  painel.innerHTML = html;

  // gráfico de barras dos últimos 14 dias
  var areaGrafico = document.getElementById("areaGrafico");
  if(visitas.length === 0){
    areaGrafico.innerHTML = '<p class="vazio-explicacao">Aqui vai aparecer um gráfico assim que as primeiras pessoas visitarem o seu portfólio.</p>';
  } else {
    var dias = [];
    for(var i = 13; i >= 0; i--){
      var d = new Date(hoje.getTime() - i*86400000);
      dias.push(d);
    }
    var maiorContagem = 1;
    var contagensPorDia = dias.map(function(d){
      var proximo = new Date(d.getTime() + 86400000);
      var qtd = visitas.filter(function(v){ var dv = new Date(v.data); return dv >= d && dv < proximo; }).length;
      if(qtd > maiorContagem) maiorContagem = qtd;
      return qtd;
    });
    var svgBarras = '<div class="grafico-barras">';
    dias.forEach(function(d, idx){
      var altura = Math.round((contagensPorDia[idx] / maiorContagem) * 90) + 4;
      svgBarras += '<div class="barra-dia" title="' + contagensPorDia[idx] + ' visita(s)"><div class="barra" style="height:' + altura + 'px"></div><div class="rotulo-dia">' + d.getDate() + '/' + (d.getMonth()+1) + '</div></div>';
    });
    svgBarras += '</div>';
    areaGrafico.innerHTML = svgBarras;
  }

  var areaOrigens = document.getElementById("areaOrigens");
  if(visitas.length === 0){
    areaOrigens.innerHTML = '<p class="vazio-explicacao">Assim que houver visitas, elas vão aparecer aqui agrupadas por origem.</p>';
  } else {
    var listaOrigens = Object.keys(contagemOrigem).map(function(o){ return { origem: o, qtd: contagemOrigem[o] }; });
    listaOrigens.sort(function(a,b){ return b.qtd - a.qtd; });
    var htmlOrigens = "";
    listaOrigens.slice(0, 8).forEach(function(o){
      htmlOrigens += '<div style="display:flex; justify-content:space-between; padding:5px 0; font-size:.8rem; border-bottom:1px solid #f1ecdf;"><span>' + escapa(o.origem) + '</span><strong>' + o.qtd + '</strong></div>';
    });
    areaOrigens.innerHTML = htmlOrigens;
  }

  // tabela de vídeos
  if(videos.length > 0){
    var corpo = document.getElementById("corpoTabelaVideos");
    videos.forEach(function(v){
      var tr = el(
        '<tr draggable="false" data-id="' + v.id + '">' +
          '<td><span class="alcinha" title="Arraste para reordenar">' + icone("alca") + '</span></td>' +
          '<td><strong>' + escapa(v.titulo) + '</strong><br><span style="color:#8a8272;font-size:.7rem;">' + escapa(v.formato || "") + '</span></td>' +
          '<td>' + escapa(v.nicho) + '</td>' +
          '<td>' + escapa(v.marca || "-") + '</td>' +
          '<td>' + escapa(v.destaque || "-") + '</td>' +
          '<td><button class="icone-olho" data-acao="visivel" title="Mostrar ou esconder do site">' + icone(v.visivel ? "olhoAberto" : "olhoFechado") + '</button></td>' +
          '<td><div class="acoes-linha">' +
            '<button class="btn btn-icone" data-acao="editar" title="Editar">' + icone("editar") + '</button>' +
            '<button class="btn btn-icone btn-perigo" data-acao="apagar" title="Apagar">' + icone("lixeira") + '</button>' +
          '</div></td>' +
        '</tr>'
      );

      tr.querySelector('[data-acao="visivel"]').addEventListener("click", async function(){
        var res = await buscarSeguro(banco.from("videos").update({ visivel: !v.visivel }).eq("id", v.id).select());
        if(res.ok) irParaAba("portfolio");
      });
      tr.querySelector('[data-acao="editar"]').addEventListener("click", function(){ abrirFormVideo(v); });
      tr.querySelector('[data-acao="apagar"]').addEventListener("click", function(){ confirmarApagarVideo(v); });

      var alca = tr.querySelector(".alcinha");
      alca.addEventListener("mousedown", function(){ tr.draggable = true; });
      alca.addEventListener("touchstart", function(){ tr.draggable = true; }, { passive: true });
      tr.addEventListener("dragend", function(){ tr.draggable = false; tr.classList.remove("arrastando"); });
      tr.addEventListener("dragstart", function(e){
        tr.classList.add("arrastando");
        e.dataTransfer.setData("text/plain", String(v.id));
      });
      tr.addEventListener("dragover", function(e){ e.preventDefault(); });
      tr.addEventListener("drop", async function(e){
        e.preventDefault();
        var idArrastado = e.dataTransfer.getData("text/plain");
        if(String(idArrastado) === String(v.id)) return;
        await reordenarVideos(idArrastado, v.id, videos);
      });

      corpo.appendChild(tr);
    });
  }

  document.getElementById("btnNovoVideo").addEventListener("click", function(){ abrirFormVideo(null); });
}

async function reordenarVideos(idArrastadoTexto, idAlvo, videosAtuais){
  var idArrastado = Number(idArrastadoTexto);
  var lista = videosAtuais.slice();
  var indiceOrigem = lista.findIndex(function(v){ return v.id === idArrastado; });
  var indiceDestino = lista.findIndex(function(v){ return v.id === idAlvo; });
  if(indiceOrigem === -1 || indiceDestino === -1) return;

  var item = lista.splice(indiceOrigem, 1)[0];
  lista.splice(indiceDestino, 0, item);

  for(var i = 0; i < lista.length; i++){
    await buscarSeguro(banco.from("videos").update({ ordem: i + 1 }).eq("id", lista[i].id));
  }
  irParaAba("portfolio");
}

function abrirFormVideo(video){
  var editando = !!video;
  var opcoesNicho = NICHOS_VIDEO.map(function(n){
    var selecionado = editando && video.nicho === n ? "selected" : "";
    return '<option value="' + n + '" ' + selecionado + '>' + n + '</option>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">' + (editando ? "Editar vídeo" : "Adicionar vídeo") + '</p>' +
    '<form id="formVideo">' +

      })
    );
  });

  desenharTabelaMarcas(res.dados);

function rotuloSituacao(valor){
  var s = SITUACOES.find(function(s){ return s.valor === valor; });
  return s ? s.rotulo : valor;
}

function filtrarMarcas(lista){
  return lista.filter(function(m){
    if(filtroMarcaSituacao !== "todas" && m.situacao !== filtroMarcaSituacao) return false;
    if(!buscaMarcaTexto) return true;
    var alvo = (m.nome + " " + (m.instagram||"") + " " + (m.email||"")).toLowerCase();
    return alvo.indexOf(buscaMarcaTexto.toLowerCase()) !== -1;
  });
}

function desenharTabelaMarcas(todasMarcas){
  var area = document.getElementById("areaTabelaMarcas");

    return;

  if(lista.length === 0){

    return;
  }

  var tabela = el('<table><thead><tr><th>Marca</th><th>Instagram</th><th>E-mail</th><th>Telefone</th><th>Situação</th><th>Último contato</th><th></th></tr></thead><tbody></tbody></table>');
  var corpo = tabela.querySelector("tbody");

  lista.forEach(function(m){
    var s = SITUACOES.find(function(s){ return s.valor === m.situacao; }) || SITUACOES[0];

      '<tr class="clicavel">' +
        '<td><strong>' + escapa(m.nome) + '</strong></td>' +

        '<td>' + escapa(m.email || "-") + '</td>' +
        '<td>' + escapa(m.telefone || "-") + '</td>' +
        '<td><span class="pilula" style="background:' + s.cor + '22; color:' + s.cor + '">' + s.rotulo + '</span></td>' +
        '<td>' + (m.ultimo_contato ? formatarData(m.ultimo_contato) : "-") + '</td>' +
        '<td><div class="acoes-linha">' + (linkW ? '<a class="btn btn-icone" href="' + linkW + '" target="_blank" rel="noopener" title="WhatsApp" onclick="event.stopPropagation()">' + icone("whats") + '</a>' : '') + '</div></td>' +

    );
    tr.addEventListener("click", function(){ abrirFormMarca(m); });
    corpo.appendChild(tr);

function itensDoDia(dataISO, listaCal, listaCamp){
  var itens = [];
  listaCal.forEach(function(c){
    if(c.data !== dataISO) return;
    if(filtroCalTipo !== "todos" && c.tipo !== filtroCalTipo) return;
    itens.push({ tipo: c.tipo, titulo: c.titulo, feito: c.status === "feito", dado: c, ehPrazo: false });
  });
  listaCamp.forEach(function(c){
    if(c.prazo !== dataISO) return;
    itens.push({ tipo: "prazo", titulo: "Prazo: " + c.campanha, feito: c.status === "Entregue", dado: c, ehPrazo: true });
  });
  return itens;
}

function desenharCalendario(listaCal, listaCamp){
  var area = document.getElementById("areaCalGrade");
  var ano = calMesAtual.getFullYear();
  var mes = calMesAtual.getMonth();
  var primeiroDia = new Date(ano, mes, 1);
  var ultimoDia = new Date(ano, mes + 1, 0);

  // segunda = 0 ... domingo = 6
  var offsetInicio = (primeiroDia.getDay() + 6) % 7;

  var celulas = [];
  for(var i = 0; i < offsetInicio; i++){
    var diaAnterior = new Date(ano, mes, 1 - (offsetInicio - i));
    celulas.push({ data: diaAnterior, foraDoMes: true });
  }
  for(var d = 1; d <= ultimoDia.getDate(); d++){
    celulas.push({ data: new Date(ano, mes, d), foraDoMes: false });
  }
  while(celulas.length % 7 !== 0 || celulas.length < 42){
    var ultima = celulas[celulas.length - 1].data;
    var proximo = new Date(ultima);
    proximo.setDate(proximo.getDate() + 1);
    celulas.push({ data: proximo, foraDoMes: true });
    if(celulas.length >= 42) break;
  }

  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var nomesDias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

  var html = '<div class="cal-grade">';
  nomesDias.forEach(function(n){ html += '<div class="cal-dia-semana">' + n + '</div>'; });

  celulas.forEach(function(cel){
    var dataISO = cel.data.getFullYear() + "-" + String(cel.data.getMonth()+1).padStart(2,"0") + "-" + String(cel.data.getDate()).padStart(2,"0");
    var ehHoje = cel.data.getTime() === hoje.getTime();
    var itens = itensDoDia(dataISO, listaCal, listaCamp);

    var classes = "cal-cel" + (cel.foraDoMes ? " fora" : "") + (ehHoje ? " hoje" : "");
    html += '<div class="' + classes + '" data-data="' + dataISO + '">';
    html += '<button class="btn-add-dia" data-add-data="' + dataISO + '" title="Adicionar neste dia">' + icone("mais") + '</button>';
    html += '<span class="num-dia">' + cel.data.getDate() + '</span>';

    itens.slice(0, 3).forEach(function(it){
      var classeTipo = "tipo-" + (it.ehPrazo ? "prazo" : it.tipo);
      html += '<button type="button" class="cal-item ' + classeTipo + (it.feito ? " feito" : "") + '" data-item-data="' + dataISO + '">' + escapa(it.titulo) + '</button>';
    });
    if(itens.length > 3){
      html += '<button type="button" class="cal-mais" data-item-data="' + dataISO + '">+' + (itens.length - 3) + ' mais</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  area.innerHTML = html;

  area.querySelectorAll(".cal-cel").forEach(function(celEl){
    celEl.addEventListener("click", function(e){
      if(e.target.closest(".cal-item") || e.target.closest(".cal-mais") || e.target.closest(".btn-add-dia")) return;
      abrirFormCalendario(null, celEl.dataset.data);
    });
  });
  area.querySelectorAll("[data-add-data]").forEach(function(botao){
    botao.addEventListener("click", function(e){
      e.stopPropagation();
      abrirFormCalendario(null, botao.dataset.addData);
    });
  });
  area.querySelectorAll(".cal-item, .cal-mais").forEach(function(botao){
    botao.addEventListener("click", function(e){
      e.stopPropagation();
      abrirDetalheDia(botao.dataset.itemData, listaCal, listaCamp);
    });
  });
}

function abrirDetalheDia(dataISO, listaCal, listaCamp){
  var itens = itensDoDia(dataISO, listaCal, listaCamp);
  var html = '<p class="form-titulo">' + formatarData(dataISO) + '</p>';
  if(itens.length === 0){
    html += '<p class="vazio-explicacao">Nada marcado neste dia.</p>';
  } else {
    itens.forEach(function(it){
      html += '<div class="item-checklist" style="align-items:center;">' +
        '<div style="flex:1;"><span class="pilula" style="background:#eee;color:#333;">' + (it.ehPrazo ? "Prazo campanha" : rotuloTipoCal(it.tipo)) + '</span> <span style="margin-left:8px;">' + escapa(it.titulo) + '</span></div>' +
        (it.ehPrazo ? '' : '<button class="btn btn-pequeno" data-editar-cal="' + it.dado.id + '">Editar</button>') +
      '</div>';
    });
  }
  html += '<div class="form-acoes"><button class="btn" id="btnFecharDetalheDia">Fechar</button><button class="btn btn-principal" id="btnAddNesteDia">Adicionar aqui</button></div>';

  abrirModal(html);
  document.getElementById("btnFecharDetalheDia").addEventListener("click", fecharModal);
  document.getElementById("btnAddNesteDia").addEventListener("click", function(){ abrirFormCalendario(null, dataISO); });
  modalConteudo.querySelectorAll("[data-editar-cal]").forEach(function(botao){
    botao.addEventListener("click", function(){
      var item = listaCal.find(function(c){ return String(c.id) === botao.dataset.editarCal; });
      if(item) abrirFormCalendario(item, null);
    });
  });
}

function rotuloTipoCal(valor){
  var t = TIPOS_CALENDARIO.find(function(t){ return t.valor === valor; });
  return t ? t.rotulo : valor;
}

function desenharAtrasados(listaCal){
  var area = document.getElementById("areaAtrasados");
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var atrasados = listaCal.filter(function(c){
    return c.status === "a_fazer" && new Date(c.data + "T00:00:00") < hoje;
  }).sort(function(a,b){ return new Date(a.data) - new Date(b.data); });

  if(atrasados.length === 0){
    area.innerHTML = '<p class="vazio-explicacao">Nada atrasado. Tudo em dia por aqui.</p>';
    return;
  }

  area.innerHTML = "";
  atrasados.forEach(function(c){
    var dias = Math.abs(diasEntre(c.data));
    var linha = el(
      '<div class="item-atrasado">' +
        '<span>' + escapa(c.titulo) + (c.marca ? " · " + escapa(c.marca) : "") + '</span>' +
        '<strong>há ' + dias + ' dia' + (dias === 1 ? '' : 's') + '</strong>' +
      '</div>'
    );
    linha.addEventListener("click", function(){ abrirFormCalendario(c, null); });
    linha.style.cursor = "pointer";
    area.appendChild(linha);
  });
}

function abrirFormCalendario(item, dataPreenchida){
  var editando = !!item;
  var opcoesTipo = TIPOS_CALENDARIO.map(function(t){
    var sel = editando && item.tipo === t.valor ? "selected" : "";
    return '<option value="' + t.valor + '" ' + sel + '>' + t.rotulo + '</option>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">' + (editando ? "Editar item" : "Adicionar ao calendário") + '</p>' +
    '<form id="formCal">' +
      '<div class="campo"><label>Título</label><input required id="fcTitulo" value="' + (editando ? escapa(item.titulo) : "") + '"></div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Tipo</label><select id="fcTipo">' + opcoesTipo + '</select></div>' +
        '<div class="campo"><label>Data</label><input type="date" required id="fcData" value="' + (editando ? item.data : (dataPreenchida || "")) + '"></div>' +

var filtroCampanhaStatus = "todas";
var buscaCampanhaTexto = "";
var ordenacaoCampanha = { coluna: "prazo", direcao: "asc" };

async function abaCampanhas(painel){
  var res = await buscarSeguro(banco.from("campanhas").select("*"));

  var html = "";
  if(!res.ok) html += faixaAviso("Não consegui carregar a tabela de campanhas. Confira se ela existe no seu Supabase.", "erro");

  var lista = res.dados;
  var totalCampanhas = lista.length;
  var ativas = lista.filter(function(c){ return c.ativa; }).length;
  var valorTotal = lista.reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  var qtdTotal = lista.reduce(function(s,c){ return s + Number(c.qtd||0); }, 0);
  var ticketMedio = qtdTotal > 0 ? valorTotal / qtdTotal : 0;
  var aReceber = lista.filter(function(c){ return c.pagamento === "pendente"; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  var jaRecebido = lista.filter(function(c){ return c.pagamento === "pago"; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);

  html += '<div class="grade-cartoes">' +
    '<div class="cartao"><div class="numero">' + totalCampanhas + '</div><div class="rotulo">total de campanhas</div></div>' +
    '<div class="cartao"><div class="numero">' + ativas + '</div><div class="rotulo">ativas</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.15rem">' + formatarDinheiro(valorTotal) + '</div><div class="rotulo">valor total</div><div class="sub">ticket médio: ' + formatarDinheiro(ticketMedio) + ' / vídeo</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.15rem">' + formatarDinheiro(aReceber) + '</div><div class="rotulo">a receber</div><div class="sub">já recebido: ' + formatarDinheiro(jaRecebido) + '</div></div>' +
  '</div>';

  html += '<div class="barra-acoes">' +
    '<div class="campo-busca">' + icone("busca") + '<input id="buscaCampanhas" placeholder="Buscar campanha ou cliente" value="' + escapa(buscaCampanhaTexto) + '"></div>' +
    '<div class="chips" id="chipsCampanha">' +
      '<button type="button" class="chip ' + (filtroCampanhaStatus === "todas" ? "ativo" : "") + '" data-filtro="todas">Todas</button>' +
      '<button type="button" class="chip ' + (filtroCampanhaStatus === "ativas" ? "ativo" : "") + '" data-filtro="ativas">Ativas</button>' +
      '<button type="button" class="chip ' + (filtroCampanhaStatus === "finalizadas" ? "ativo" : "") + '" data-filtro="finalizadas">Finalizadas</button>' +
    '</div>' +
    '<button class="btn" id="btnBaixarCampanhas">' + icone("baixar") + ' Baixar CSV</button>' +
    '<button class="btn btn-principal" id="btnNovaCampanha">' + icone("mais") + ' Adicionar</button>' +
  '</div>';

  html += '<div class="painel-branco"><div class="tabela-scroll" id="areaTabelaCampanhas"></div></div>';

  painel.innerHTML = html;

  document.querySelectorAll("#chipsCampanha .chip").forEach(function(chip){
    chip.addEventListener("click", function(){ filtroCampanhaStatus = chip.dataset.filtro; irParaAba("campanhas"); });
  });
  document.getElementById("buscaCampanhas").addEventListener("input", function(e){
    buscaCampanhaTexto = e.target.value;
    desenharTabelaCampanhas(lista);
  });
  document.getElementById("btnNovaCampanha").addEventListener("click", function(){ abrirFormCampanha(null); });
  document.getElementById("btnBaixarCampanhas").addEventListener("click", function(){
    var linhas = filtrarOrdenarCampanhas(lista);
    baixarCSV("campanhas.csv",
      ["Campanha","Cliente","Tipo","Status","Qtd","Valor","Prazo","Pagamento","Favorita"],
      linhas.map(function(c){
        return [c.campanha, c.cliente, c.tipo, c.status, c.qtd, c.valor, c.prazo ? formatarData(c.prazo) : "", c.pagamento, c.favorita ? "Sim" : "Não"];
      })
    );
  });

  desenharTabelaCampanhas(lista);
}

function filtrarOrdenarCampanhas(lista){
  var filtrada = lista.filter(function(c){
    if(filtroCampanhaStatus === "ativas" && !c.ativa) return false;
    if(filtroCampanhaStatus === "finalizadas" && c.ativa) return false;
    if(buscaCampanhaTexto){
      var alvo = (c.campanha + " " + c.cliente).toLowerCase();
      if(alvo.indexOf(buscaCampanhaTexto.toLowerCase()) === -1) return false;
    }
    return true;
  });

  var col = ordenacaoCampanha.coluna;
  var dir = ordenacaoCampanha.direcao === "asc" ? 1 : -1;
  filtrada.sort(function(a,b){
    var va, vb;
    if(col === "status"){
      va = STATUS_CAMPANHA.indexOf(a.status);
      vb = STATUS_CAMPANHA.indexOf(b.status);
    } else if(col === "valor" || col === "qtd"){
      va = Number(a[col] || 0);
      vb = Number(b[col] || 0);
    } else if(col === "prazo"){
      va = a.prazo ? new Date(a.prazo).getTime() : Infinity;
      vb = b.prazo ? new Date(b.prazo).getTime() : Infinity;
    } else {
      va = String(a[col] || "").toLowerCase();
      vb = String(b[col] || "").toLowerCase();
    }
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return 0;
  });
  return filtrada;
}

var COLUNAS_CAMPANHA = [
  { chave: "campanha", rotulo: "Campanha" },
  { chave: "cliente", rotulo: "Cliente" },
  { chave: "tipo", rotulo: "Tipo" },
  { chave: "status", rotulo: "Status" },
  { chave: "qtd", rotulo: "Qtd" },
  { chave: "valor", rotulo: "Valor" },
  { chave: "prazo", rotulo: "Prazo" },
  { chave: "pagamento", rotulo: "Pagamento" }
];

function desenharTabelaCampanhas(todasCampanhas){
  var area = document.getElementById("areaTabelaCampanhas");

  if(todasCampanhas.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Você ainda não tem campanhas cadastradas. Clique em "Adicionar" para criar a primeira.</div>';
    return;
  }

  var lista = filtrarOrdenarCampanhas(todasCampanhas);
  if(lista.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Nenhuma campanha encontrada com esse filtro.</div>';
    return;
  }

  var thead = '<tr><th></th>' + COLUNAS_CAMPANHA.map(function(c){
    var ativa = ordenacaoCampanha.coluna === c.chave;
    var setaTxt = ativa ? (ordenacaoCampanha.direcao === "asc" ? "▲" : "▼") : "▲";
    return '<th class="ordenavel ' + (ativa ? "ativa" : "") + '" data-coluna="' + c.chave + '">' + c.rotulo + ' <span class="seta">' + setaTxt + '</span></th>';
  }).join("") + '</tr>';

  var linhasHtml = lista.map(function(c){
    var tipoCor = TIPO_CAMPANHA_COR[c.tipo] || "#888";
    var statusCor = STATUS_CAMPANHA_COR[c.status] || "#888";
    var etiquetaPrazo = "";
    if(c.prazo && c.status !== "Entregue"){
      var diff = diasEntre(c.prazo);
      if(diff < 0) etiquetaPrazo = '<span class="etiqueta atrasado">Atrasado ' + Math.abs(diff) + 'd</span>';
      else if(diff <= 3) etiquetaPrazo = '<span class="etiqueta vence">Vence em ' + diff + 'd</span>';
    }
    return '<tr class="linha-campanha ' + (c.favorita ? "linha-favorita" : "") + '" data-id="' + c.id + '">' +
      '<td><button class="icone-olho" data-favorita="' + c.id + '" title="Destacar">' + icone(c.favorita ? "estrelaCheia" : "estrelaVazia") + '</button></td>' +
      '<td><strong>' + escapa(c.campanha) + '</strong></td>' +
      '<td>' + escapa(c.cliente) + '</td>' +
      '<td><span class="pilula" style="background:' + tipoCor + '22;color:' + tipoCor + '">' + escapa(c.tipo) + '</span></td>' +
      '<td><span class="pilula" style="background:' + statusCor + '22;color:' + statusCor + '">' + escapa(c.status) + '</span></td>' +
      '<td>' + c.qtd + '</td>' +
      '<td>' + formatarDinheiro(c.valor) + '</td>' +
      '<td>' + (c.prazo ? formatarData(c.prazo) : "-") + etiquetaPrazo + '</td>' +
      '<td><span class="pilula" style="background:' + (c.pagamento === "pago" ? "#7ea60022" : "#8a8a8a22") + ';color:' + (c.pagamento === "pago" ? "#4b8f00" : "#666") + '">' + (c.pagamento === "pago" ? "Pago" : "Pendente") + '</span></td>' +
    '</tr>';
  }).join("");

  area.innerHTML = '<table><thead>' + thead + '</thead><tbody>' + linhasHtml + '</tbody></table>';

  area.querySelectorAll("th.ordenavel").forEach(function(th){
    th.addEventListener("click", function(){
      var coluna = th.dataset.coluna;
      if(ordenacaoCampanha.coluna === coluna){
        ordenacaoCampanha.direcao = ordenacaoCampanha.direcao === "asc" ? "desc" : "asc";
      } else {
        ordenacaoCampanha.coluna = coluna;
        ordenacaoCampanha.direcao = "asc";
      }
      desenharTabelaCampanhas(todasCampanhas);
    });
  });

  area.querySelectorAll("[data-favorita]").forEach(function(botao){
    botao.addEventListener("click", async function(e){
      e.stopPropagation();
      var id = Number(botao.dataset.favorita);
      var camp = todasCampanhas.find(function(c){ return c.id === id; });
      await buscarSeguro(banco.from("campanhas").update({ favorita: !camp.favorita }).eq("id", id));
      irParaAba("campanhas");
    });
  });

  area.querySelectorAll(".linha-campanha").forEach(function(tr){
    tr.addEventListener("click", function(){
      var id = Number(tr.dataset.id);
      var camp = todasCampanhas.find(function(c){ return c.id === id; });
      abrirFormCampanha(camp);
    });
  });
}

var checklistSubaba = "checklist";
var marcadosCache = {};

async function abaChecklist(painel){
  if(!window.Biblioteca){
    painel.innerHTML = faixaAviso("Não encontrei o arquivo js/biblioteca.js. Confira se ele foi salvo dentro da pasta js do seu projeto.", "erro");
    return;
  }

  var res = await buscarSeguro(banco.from("marcados").select("*"));
  marcadosCache = {};
  if(res.ok){
    res.dados.forEach(function(m){ marcadosCache[m.chave] = m.marcado; });
  }

  var subabas = [
    { chave: "checklist", rotulo: "Checklist do portfólio" },
    { chave: "referencias", rotulo: "Referências de vídeo" },
    { chave: "roteiros", rotulo: "Roteiros" },
    { chave: "nichos", rotulo: "Ideias por nicho" },
    { chave: "revisao", rotulo: "Revisar meu roteiro" }
  ];

  var html = "";
  if(!res.ok) html += faixaAviso("Não consegui carregar o que você já marcou. Suas marcações desta sessão podem não salvar até isso ser corrigido.", "erro");

  html += '<div class="subtabs">' + subabas.map(function(s){
    return '<button type="button" class="subtab-btn ' + (checklistSubaba === s.chave ? "ativo" : "") + '" data-sub="' + s.chave + '">' + s.rotulo + '</button>';
  }).join("") + '</div>';
  html += '<div id="areaSubaba"></div>';

  painel.innerHTML = html;

  document.querySelectorAll(".subtab-btn").forEach(function(botao){
    botao.addEventListener("click", function(){ checklistSubaba = botao.dataset.sub; irParaAba("checklist"); });
  });

  var area = document.getElementById("areaSubaba");
  if(checklistSubaba === "checklist") desenharSubChecklist(area);
  else if(checklistSubaba === "referencias") desenharSubReferencias(area);
  else if(checklistSubaba === "roteiros") desenharSubRoteiros(area);
  else if(checklistSubaba === "nichos") desenharSubNichos(area);
  else if(checklistSubaba === "revisao") desenharSubRevisao(area);
}

function desenharSubChecklist(area){
  var secoes = window.Biblioteca.CHECKLIST || [];
  var totalItens = 0, totalMarcados = 0;
  secoes.forEach(function(s){
    (s.itens||[]).forEach(function(it, idx){
      totalItens++;
      if(marcadosCache[s.id + ":" + idx]) totalMarcados++;
    });
  });
  var pctGeral = totalItens > 0 ? Math.round((totalMarcados/totalItens)*100) : 0;

  var html = '<div class="painel-branco"><div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:.8rem; font-weight:700;"><span>Progresso geral</span><span>' + pctGeral + '%</span></div><div class="barra-progresso"><div style="width:' + pctGeral + '%"></div></div></div>';

  secoes.forEach(function(secao){
    var itens = secao.itens || [];
    var marcadosSecao = itens.filter(function(it, idx){ return marcadosCache[secao.id + ":" + idx]; }).length;
    var pct = itens.length > 0 ? Math.round((marcadosSecao/itens.length)*100) : 0;

    html += '<details class="secao-checklist" data-secao="' + secao.id + '">' +
      '<summary>' +
        '<span class="titulo-secao">' + (secao.emoji||"") + ' ' + escapa(secao.nome) + '</span>' +
        '<span class="progresso-secao"><div class="barra-progresso"><div style="width:' + pct + '%"></div></div>' + marcadosSecao + '/' + itens.length + '</span>' +
      '</summary>' +
      '<div class="corpo-secao">' +
        '<p class="porque">' + escapa(secao.porque) + '</p>' +
        itens.map(function(it, idx){
          var chave = secao.id + ":" + idx;
          var marcado = !!marcadosCache[chave];
          return '<label class="item-checklist"><input type="checkbox" data-chave-marcado="' + chave + '" ' + (marcado ? "checked" : "") + '><span><span class="t">' + escapa(it.t) + '</span><br><span class="d">' + escapa(it.d) + '</span></span></label>';
        }).join("") +
      '</div>' +
    '</details>';
  });

  area.innerHTML = html;

  area.querySelectorAll("[data-chave-marcado]").forEach(function(chk){
    chk.addEventListener("change", async function(){
      var chave = chk.dataset.chaveMarcado;
      marcadosCache[chave] = chk.checked;
      await buscarSeguro(banco.from("marcados").upsert({ chave: chave, marcado: chk.checked, atualizado_em: new Date().toISOString() }));
      desenharSubChecklist(area);
    });
  });
}

var CORES_CARTAO = ["#2b6fff", "#ff6a2b", "#c3f53a", "#ff3da6"];

function desenharSubReferencias(area){
  var refs = window.Biblioteca.REFERENCIAS || [];

    '</button>';
  });
  html += '</div>';

  area.querySelectorAll("[data-ref]").forEach(function(botao){

function abrirDetalheReferencia(r){

  html += '<p style="font-size:.8rem; margin-bottom:8px;"><strong>Diferencial:</strong> ' + escapa(r.diferencial) + '</p>';

  abrirModal(html, true);
}

function desenharSubRoteiros(area){
  var tipos = window.Biblioteca.TIPOS || [];
  var html = "";
  tipos.forEach(function(t){
    html += '<details class="tipo-roteiro"><summary>' + (t.emoji||"") + ' ' + escapa(t.nome) + ' <span style="font-weight:400;color:#8a8272;font-size:.75rem;">· ' + escapa(t.duracao||"") + '</span></summary>' +
      '<div class="corpo">' +
        '<p style="font-size:.8rem; margin-bottom:12px;"><strong>Quando usar:</strong> ' + escapa(t.porque) + '</p>' +
        (t.beats||[]).map(function(b){ return '<div class="bloco-tempo"><div class="t">' + escapa(b.t) + '</div><div>' + b.o + '</div></div>'; }).join("") +
        (t.erros && t.erros.length ? '<p style="font-size:.78rem; margin-top:10px;"><strong>Erros comuns:</strong> ' + t.erros.map(escapa).join(" · ") + '</p>' : "") +
      '</div>' +
    '</details>';
  });
  area.innerHTML = html;
}

function desenharSubNichos(area){
  var nichos = window.Biblioteca.NICHOS || [];
  var html = "";
  nichos.forEach(function(n){
    html += '<div class="nicho-bloco"><h3>' + (n.emoji||"") + ' ' + escapa(n.nome) + '</h3>';
    (n.ideias||[]).forEach(function(i){
      html += '<div class="ideia-card"><div class="t">' + escapa(i.t) + '</div><div class="gancho">"' + escapa(i.gancho) + '"</div></div>';

function desenharSubRevisao(area){
  var blocos = window.Biblioteca.REVISAO || [];
  var html = '<div class="revisao-grade">';
  html += '<div><p class="painel-titulo">Cole seu roteiro aqui</p><textarea id="campoRoteiroRevisao" style="width:100%; min-height:300px; border:1.5px solid #e0d9c6; border-radius:8px; padding:10px;" placeholder="Cole aqui o roteiro que você escreveu"></textarea></div>';
  html += '<div>';
  blocos.forEach(function(b, idxB){
    html += '<div class="revisao-bloco"><h3>' + (b.emoji||"") + ' ' + escapa(b.bloco) + '</h3>';
    (b.itens||[]).forEach(function(it, idxI){
      html += '<label class="item-checklist"><input type="checkbox"><span><span class="t">' + escapa(it.t) + '</span><br><span class="d">' + escapa(it.d) + '</span></span></label>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  area.innerHTML = html;
}

/* ============================================================================

============================================================================ */
// Se algo impedir o painel de abrir (banco fora do ar, internet, CDN
// bloqueada, etc), mostra um aviso claro no lugar do "Carregando..." que
// ficaria preso na tela para sempre.
function mostrarErroCarregamento(mensagem){
  var tela = document.getElementById("telaCarregando");
  if(!tela) return;
  tela.innerHTML =
    '<div style="max-width:380px; text-align:center; padding:24px;">' +
      '<p style="font-weight:700; margin-bottom:8px;">Não consegui abrir o painel</p>' +
      '<p style="font-size:.85rem; color:#666; margin-bottom:16px;">' + mensagem + '</p>' +
      '<button onclick="window.location.reload()" style="font-family:inherit; font-weight:700; font-size:.82rem; padding:9px 18px; border-radius:999px; border:1.5px solid #111; background:#c3f53a; cursor:pointer;">Tentar de novo</button>' +
    '</div>';
}

async function iniciar(){
  try{
    if(!window.banco){
      mostrarErroCarregamento("Não consegui carregar a conexão com o banco de dados (Supabase). Verifique sua internet e clique em tentar de novo. Se continuar, veja se algum bloqueador de anúncios ou extensão do navegador não está travando o carregamento.");
      return;
    }

    // Se a verificação de login demorar demais (mais de 10 segundos),
    // mostra o aviso em vez de deixar a tela presa em "Carregando...".
    var resultado = await Promise.race([
      banco.auth.getSession(),
      new Promise(function(_, rejeitar){
        setTimeout(function(){ rejeitar(new Error("Demorou demais para responder")); }, 10000);
      })
    ]);
    var sessao = resultado.data && resultado.data.session;

    if(!sessao){
      window.location.href = "../login/";
      return;
    }

    document.getElementById("emailUsuaria").textContent = sessao.user.email;
    document.getElementById("btnSair").innerHTML = icone("sair") + "Sair";
    document.getElementById("btnSair").addEventListener("click", async function(){
      await banco.auth.signOut();
      window.location.href = "../login/";
    });

    banco.auth.onAuthStateChange(function(evento){
      if(evento === "SIGNED_OUT"){
        window.location.href = "../login/";
      }
    });

    document.body.classList.remove("carregando");
    document.getElementById("telaCarregando").hidden = true;
    document.getElementById("app").hidden = false;

    irParaAba("portfolio");
  }catch(erro){
    console.error(erro);
    mostrarErroCarregamento("Algo deu errado ao verificar seu login (" + (erro && erro.message ? erro.message : "erro desconhecido") + "). Clique em tentar de novo. Se continuar, confira sua internet.");
  }
}

iniciar();
</script>
