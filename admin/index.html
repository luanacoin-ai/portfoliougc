<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel | Luana Coin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe4;
    --paper-2:#eee6d6;
    --black:#111111;
    --blue:#2b6fff;
    --orange:#ff6a2b;
    --lime:#c3f53a;
    --magenta:#ff3da6;
    --white:#ffffff;
    --cinza:#8a8a8a;
    --vermelho:#e5484d;
    --radius:10px;
    --ff:'Poppins', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--ff);
    font-size:14px;
    color:var(--black);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:.9rem; }
  h1,h2,h3{ margin:0; font-weight:700; }
  p{ margin:0; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#d8cfba; border-radius:99px; }

  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }

  #telaCarregando{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.9rem;
    color:#666;
  }
  #telaCarregando[hidden]{ display:none; }

  /* ---------- layout geral ---------- */
  #app{ display:flex; min-height:100vh; }
  #app[hidden]{ display:none; }

  #sidebar{
    width:220px;
    min-width:220px;
    background:var(--white);
    border-right:2px solid var(--black);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .sidebar-topo{
    padding:18px 18px 14px;
    font-weight:700;
    font-size:.95rem;
    border-bottom:1px solid #e6e0d0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sidebar-topo .bolinha{
    width:26px; height:26px; border-radius:50%;
    background:var(--black); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-size:.75rem; font-weight:700;
  }
  nav.menu{ flex:1; overflow-y:auto; padding:10px 10px; }
  .grupo-label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#9a9282;
    font-weight:600;
    margin:14px 10px 6px;
  }
  .grupo-label:first-child{ margin-top:2px; }
  .item-menu{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:none;
    background:none;
    border-radius:8px;
    font-size:.85rem;
    font-weight:500;
    color:var(--black);
    text-align:left;
    margin-bottom:2px;
  }
  .item-menu:hover{ background:#f2ece0; }
  .item-menu.ativo{
    background:rgba(43,111,255,.12);
    color:var(--blue);
    font-weight:700;
  }
  .item-menu svg{ width:18px; height:18px; flex-shrink:0; }
  .sidebar-rodape{
    border-top:1px solid #e6e0d0;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sidebar-rodape .email{
    font-size:.72rem;
    color:#8a8272;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #btnSair{
    display:flex;
    align-items:center;
    gap:8px;
    border:1.5px solid var(--black);
    background:var(--white);
    border-radius:8px;
    padding:7px 10px;
    font-size:.78rem;
    font-weight:600;
  }
  #btnSair:hover{ background:#f2ece0; }
  #btnSair svg{ width:15px; height:15px; }

  #btnMenuMobile{
    display:none;
    position:fixed;
    top:12px; left:12px;
    z-index:50;
    width:38px; height:38px;
    border-radius:8px;
    border:2px solid var(--black);
    background:var(--white);
  }
  #overlayMobile{
    display:none;
    position:fixed; inset:0;
    background:rgba(17,17,17,.4);
    z-index:39;
  }
  #overlayMobile.aberto{ display:block; }

  @media (max-width: 880px){
    #btnMenuMobile{ display:flex; align-items:center; justify-content:center; }
    #sidebar{
      position:fixed;
      left:-240px;
      top:0;
      z-index:40;
      transition:left .2s ease;
      box-shadow:6px 0 20px rgba(0,0,0,.15);
    }
    #sidebar.aberta{ left:0; }
    #conteudo{ padding-top:64px !important; }
  }

  #conteudo{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .cabecalho-aba{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
  }
  .cabecalho-aba h1{ font-size:1.25rem; }

  .aviso{
    border:1.5px solid #f0c04a;
    background:#fff6de;
    color:#6b4e00;
    border-radius:8px;
    padding:10px 14px;
    font-size:.8rem;
    margin-bottom:16px;
  }
  .aviso.erro{ border-color:var(--vermelho); background:#fdeaea; color:#8f1d20; }
  .vazio-explicacao{
    border:1.5px dashed #cfc5ac;
    border-radius:10px;
    padding:20px;
    text-align:center;
    font-size:.82rem;
    color:#7a7360;
  }

  /* ---------- cartões / grade ---------- */
  .grade-cartoes{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .cartao{
    background:var(--white);
    border:1.5px solid #e6e0d0;
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .cartao .numero{ font-size:1.5rem; font-weight:700; }
  .cartao .rotulo{ font-size:.74rem; color:#8a8272; margin-top:2px; }
  .cartao .sub{ font-size:.72rem; color:#8a8272; margin-top:4px; }

  .painel-branco{
    background:var(--white);
    border:1.5px solid #e6e0d0;
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:20px;
  }
  .painel-titulo{
    font-size:.85rem;
    font-weight:700;
    margin-bottom:12px;
  }

  /* ---------- botões ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:.8rem;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid var(--black);
    background:var(--white);
    color:var(--black);
  }
  .btn:hover{ background:#f2ece0; }
  .btn svg{ width:14px; height:14px; }
  .btn-principal{ background:var(--lime); }
  .btn-principal:hover{ background:#b3e02e; }
  .btn-perigo{ border-color:var(--vermelho); color:var(--vermelho); }
  .btn-perigo:hover{ background:#fdeaea; }
  .btn-pequeno{ padding:5px 10px; font-size:.72rem; }
  .btn-icone{
    width:30px; height:30px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }

  .barra-acoes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .barra-acoes .campo-busca{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:6px;
    border:1.5px solid #e6e0d0;
    border-radius:999px;
    padding:6px 12px;
    background:var(--paper);
  }
  .barra-acoes .campo-busca svg{ width:14px; height:14px; opacity:.6; }
  .barra-acoes .campo-busca input{
    border:none; background:none; outline:none; width:100%; font-size:.82rem;
  }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    padding:6px 12px;
    border-radius:999px;
    border:1.5px solid #e6e0d0;
    font-size:.75rem;
    font-weight:600;
    background:var(--white);
  }
  .chip.ativo{ background:var(--black); color:var(--white); border-color:var(--black); }

  /* ---------- tabelas ---------- */
  table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  th, td{ text-align:left; padding:9px 10px; border-bottom:1px solid #efe9db; }
  th{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:#8a8272;
    font-weight:700;
    white-space:nowrap;
  }
  th.ordenavel{ cursor:pointer; user-select:none; }
  th.ordenavel .seta{ opacity:.25; font-size:.7rem; margin-left:3px; }
  th.ordenavel.ativa .seta{ opacity:1; color:var(--blue); }
  tbody tr:hover{ background:#faf7ef; }
  tbody tr.clicavel{ cursor:pointer; }
  .tabela-scroll{ overflow-x:auto; }

  .pilula{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:.7rem;
    font-weight:700;
    white-space:nowrap;
  }
  .etiqueta{
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    font-size:.68rem;
    font-weight:700;
    margin-left:6px;
  }
  .etiqueta.atrasado{ background:#fdeaea; color:var(--vermelho); }
  .etiqueta.vence{ background:#fff6de; color:#8a6400; }

  .select-status{
    border:none;
    border-radius:999px;
    padding:4px 22px 4px 10px;
    font-size:.7rem;
    font-weight:700;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background-repeat:no-repeat;
    background-position:right 6px center;
    background-size:12px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23111111" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
  }
  .barra-acoes select.btn{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding-right:28px;
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:12px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23111111" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
  }

  .linha-favorita{ box-shadow: inset 3px 0 0 var(--magenta); }

  .acoes-linha{ display:flex; gap:4px; }

  /* ---------- olho / drag ---------- */
  .icone-olho{ background:none; border:none; padding:4px; display:flex; }
  .icone-olho svg{ width:17px; height:17px; }
  .alcinha{ cursor:grab; color:#b7ae98; display:flex; }
  .alcinha svg{ width:16px; height:16px; }
  tr.arrastando{ opacity:.4; }

  /* ---------- modal ---------- */
  #modalOverlay{
    position:fixed; inset:0;
    background:rgba(17,17,17,.5);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    z-index:100;
  }
  #modalOverlay[hidden]{ display:none; }
  #modalBox{
    background:var(--white);
    border-radius:14px;
    max-width:520px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
    position:relative;
  }
  #modalBox.largo{ max-width:680px; }
  #modalFechar{
    position:absolute;
    top:14px; right:14px;
    width:30px; height:30px;
    border-radius:50%;
    border:1.5px solid var(--black);
    background:var(--white);
  }
  #modalFechar svg{ width:14px; height:14px; }
  .form-titulo{ font-size:1rem; font-weight:700; margin-bottom:16px; padding-right:30px; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:.76rem; font-weight:700; margin-bottom:5px; }
  .campo input, .campo select, .campo textarea{
    width:100%;
    border:1.5px solid #e0d9c6;
    border-radius:8px;
    padding:9px 10px;
    background:var(--paper);
  }
  .campo textarea{ min-height:80px; resize:vertical; }
  .campo-check{ display:flex; align-items:center; gap:8px; }
  .campo-check input{ width:auto; }
  .form-linha{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-acoes{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; }

  /* ---------- gráfico simples de barras ---------- */
  .grafico-barras{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:110px;
    padding-top:10px;
  }
  .grafico-barras .barra-dia{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:4px;
  }
  .grafico-barras .barra{
    width:100%;
    max-width:22px;
    background:var(--blue);
    border-radius:4px 4px 0 0;
    min-height:2px;
  }
  .grafico-barras .rotulo-dia{ font-size:.6rem; color:#8a8272; white-space:nowrap; }

  /* ---------- calendário ---------- */
  .cal-topo{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav .mes-atual{ font-weight:700; font-size:.95rem; min-width:150px; text-align:center; text-transform:capitalize; }
  .cal-grade{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#e6e0d0; border:1px solid #e6e0d0; border-radius:10px; overflow:hidden; }
  .cal-dia-semana{ background:var(--paper-2); text-align:center; font-size:.68rem; font-weight:700; padding:6px 0; text-transform:uppercase; color:#8a8272; }
  .cal-cel{ background:var(--white); min-height:96px; padding:6px; position:relative; display:flex; flex-direction:column; gap:3px; }
  .cal-cel.fora{ background:#faf8f2; color:#c7bfa9; }
  .cal-cel.hoje{ box-shadow:inset 0 0 0 2px var(--blue); }
  .cal-cel .num-dia{ font-size:.72rem; font-weight:700; }
  .cal-cel .btn-add-dia{
    position:absolute; top:4px; right:4px;
    width:18px; height:18px; border-radius:5px;
    border:1px solid var(--black); background:var(--white);
    display:none; align-items:center; justify-content:center; padding:0;
  }
  .cal-cel:hover .btn-add-dia{ display:flex; }
  .cal-cel .btn-add-dia svg{ width:10px; height:10px; }
  .cal-item{
    font-size:.64rem;
    font-weight:600;
    padding:2px 5px;
    border-radius:5px;
    background:#eef2ff;
    color:var(--black);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .cal-item.tipo-gravar{ background:rgba(43,111,255,.15); }
  .cal-item.tipo-editar{ background:rgba(255,106,43,.18); }
  .cal-item.tipo-postar{ background:rgba(255,61,166,.15); }
  .cal-item.tipo-prazo{ background:rgba(17,17,17,.08); font-style:italic; }
  .cal-item.feito{ text-decoration:line-through; opacity:.55; }
  .cal-mais{ font-size:.63rem; font-weight:700; color:var(--blue); background:none; border:none; text-align:left; padding:0 5px; }

  @media (max-width:700px){
    .cal-grade{ grid-template-columns:repeat(7,1fr); }
    .cal-cel{ min-height:64px; font-size:.9em; }
    .cal-dia-semana{ font-size:.55rem; }
  }

  .bloco-atrasados .item-atrasado{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:8px; background:#fdeaea; margin-bottom:6px; font-size:.78rem;
  }

  /* ---------- checklist ---------- */
  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1.5px solid #e6e0d0; padding-bottom:10px; }
  .subtab-btn{
    padding:7px 14px; border-radius:999px; border:1.5px solid #e6e0d0; background:var(--white); font-size:.78rem; font-weight:600;
  }
  .subtab-btn.ativo{ background:var(--blue); border-color:var(--blue); color:var(--white); }

  .barra-progresso{ height:7px; border-radius:99px; background:#eee5d2; overflow:hidden; }
  .barra-progresso > div{ height:100%; background:var(--lime); }

  .item-checklist{ display:flex; gap:10px; padding:8px 0; border-top:1px solid #f1ecdf; }
  .item-checklist:first-child{ border-top:none; }
  .item-checklist input{ margin-top:3px; width:16px; height:16px; }
  .item-checklist .t{ font-size:.82rem; font-weight:600; }
  .item-checklist .d{ font-size:.74rem; color:#8a8272; margin-top:2px; }

  .grade-referencias{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:14px; }
  .cartao-ref{ border:1.5px solid #e6e0d0; border-radius:10px; overflow:hidden; background:var(--white); text-align:left; }
  .cartao-ref .capa-ref{
    aspect-ratio:9/16; display:flex; align-items:center; justify-content:center; font-size:2rem;
  }
  .cartao-ref .info-ref{ padding:10px 12px; }
  .cartao-ref .titulo-ref{ font-size:.8rem; font-weight:700; margin-bottom:3px; }
  .cartao-ref .meta-ref{ font-size:.68rem; color:#8a8272; }

  .bloco-tempo{ border-left:2px solid var(--blue); padding:6px 0 6px 12px; margin-bottom:8px; font-size:.8rem; }
  .bloco-tempo .t{ font-size:.68rem; font-weight:700; color:var(--blue); margin-bottom:2px; }

  .tipo-roteiro{ border:1.5px solid #e6e0d0; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .tipo-roteiro summary{ list-style:none; cursor:pointer; padding:12px 14px; font-weight:700; font-size:.85rem; display:flex; gap:10px; align-items:center; }
  .tipo-roteiro summary::-webkit-details-marker{ display:none; }
  .tipo-roteiro .corpo{ padding:0 16px 16px; }

  .nicho-bloco{ margin-bottom:18px; }
  .nicho-bloco h3{ font-size:.9rem; margin-bottom:8px; }
  .ideia-card{ border:1.5px solid #e6e0d0; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .ideia-card .t{ font-weight:700; font-size:.8rem; }
  .ideia-card .gancho{ font-size:.76rem; color:#6b6353; margin-top:3px; font-style:italic; }

  .revisao-grade{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:900px){ .revisao-grade{ grid-template-columns:1fr; } }
  .revisao-bloco{ border:1.5px solid #e6e0d0; border-radius:10px; padding:14px; margin-bottom:12px; }
  .revisao-bloco h3{ font-size:.82rem; margin-bottom:8px; }

  /* ---------- disparo de e-mails ---------- */
  .capa-disparo{
    border-radius:18px;
    padding:26px 28px;
    margin-bottom:20px;
    background:linear-gradient(135deg, var(--blue), #123a8f);
    color:var(--white);
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:18px;
  }
  .capa-disparo .capa-esquerda{ display:flex; gap:14px; align-items:flex-start; max-width:520px; }
  .capa-disparo .capa-icone{
    width:44px; height:44px; min-width:44px; border-radius:12px;
    background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .capa-disparo .capa-icone svg{ width:22px; height:22px; }
  .capa-disparo h2{ font-size:1.15rem; margin-bottom:4px; }
  .capa-disparo p{ font-size:.82rem; opacity:.9; }
  .capa-disparo .capa-numero{ text-align:right; }
  .capa-disparo .capa-numero .num{ font-size:2.1rem; font-weight:700; line-height:1; }
  .capa-disparo .capa-numero .rot{ font-size:.72rem; opacity:.85; margin-top:4px; }
  .capa-disparo .capa-etiquetas{ width:100%; display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .capa-disparo .etiqueta-capa{
    background:rgba(255,255,255,.16);
    border-radius:999px;
    padding:5px 12px;
    font-size:.7rem;
    font-weight:600;
  }

  .cartao-borda{
    background:var(--white);
    border:1.5px solid #e6e0d0;
    border-radius:var(--radius);
    padding:14px 16px;
    border-left:4px solid var(--cor-cartao, var(--blue));
  }
  .cartao-borda .numero{ font-size:1.5rem; font-weight:700; color:var(--cor-cartao, var(--blue)); }
  .cartao-borda .rotulo{ font-size:.74rem; color:#8a8272; margin-top:2px; }
  .cartao-borda .sub{ font-size:.7rem; color:#8a8272; margin-top:4px; }

  .disparo-grade{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:980px){ .disparo-grade{ grid-template-columns:1fr; } }
  .disparo-grade .coluna-preview{ position:sticky; top:20px; }
  @media (max-width:980px){ .disparo-grade .coluna-preview{ position:static; } }

function corNicho(nicho){
  var idx = NICHOS_VIDEO.indexOf(nicho);
  return idx === -1 ? "#8a8a8a" : CORES_NICHO[idx % CORES_NICHO.length];
}
// Monta as <option> do seletor de nicho. Se o valor atual não bater com
// nenhum nicho da lista fixa (ex: veio de uma planilha antiga com texto
// livre), ele entra como uma opção extra, pra não sumir dado ninguém pediu.
function opcoesSelectNicho(valorAtual){
  var opcoes = '<option value="" ' + (!valorAtual ? "selected" : "") + '>-</option>';
  opcoes += NICHOS_VIDEO.map(function(n){
    return '<option value="' + escapa(n) + '" ' + (valorAtual === n ? "selected" : "") + '>' + escapa(n) + '</option>';
  }).join("");
  if(valorAtual && NICHOS_VIDEO.indexOf(valorAtual) === -1){
    opcoes += '<option value="' + escapa(valorAtual) + '" selected>' + escapa(valorAtual) + '</option>';
  }
  return opcoes;
}

/* ============================================================================
   AJUDANTES GERAIS
============================================================================ */
function el(html){
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapa(texto){
  if(texto === null || texto === undefined) return "";
  var d = document.createElement("div");
  d.textContent = String(texto);
  return d.innerHTML;
}

function formatarData(dataTexto){
  if(!dataTexto) return "";
  var partes = dataTexto.split("-");
  if(partes.length !== 3) return dataTexto;
  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

function formatarDinheiro(valor){
  var n = Number(valor || 0);
  return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function diasEntre(dataTexto){
  var hoje = new Date();
  hoje.setHours(0,0,0,0);
  var alvo = new Date(dataTexto + "T00:00:00");
  var diff = Math.round((alvo - hoje) / 86400000);
  return diff;
}

function somenteDigitos(texto){
  return String(texto || "").replace(/\D/g, "");
}

function linkWhatsapp(telefone){
  var digitos = somenteDigitos(telefone);
  if(!digitos) return null;
  if(digitos.length <= 11) digitos = "55" + digitos;
  return "https://wa.me/" + digitos;
}

function linkInstagram(usuario){
  if(!usuario) return null;
  var limpo = String(usuario).replace("@", "").trim();
  if(!limpo) return null;
  return "https://instagram.com/" + limpo;
}

function baixarCSV(nomeArquivo, colunas, linhas){
  var conteudo = colunas.map(function(c){ return '"' + c.replace(/"/g,'""') + '"'; }).join(";") + "\r\n";
  linhas.forEach(function(linha){
    conteudo += linha.map(function(valor){
      valor = valor === null || valor === undefined ? "" : String(valor);
      return '"' + valor.replace(/"/g,'""') + '"';
    }).join(";") + "\r\n";
  });
  var blob = new Blob(["﻿" + conteudo], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Busca segura: nunca deixa um erro de uma tabela quebrar o painel inteiro.
async function buscarSeguro(promessa){
  try{
    var resultado = await promessa;
    if(resultado.error) throw resultado.error;
    return { ok: true, dados: resultado.data || [] };
  }catch(erro){
    console.error(erro);
    return { ok: false, dados: [], mensagem: erro && erro.message ? erro.message : "Erro desconhecido" };
  }
}

function faixaAviso(texto, tipo){
  return '<p class="aviso ' + (tipo || "") + '">' + escapa(texto) + "</p>";
}

   ABA 1: PORTFÓLIO
============================================================================ */
async function abaPortfolio(painel){
  var resVideos = await buscarSeguro(banco.from("videos").select("*").order("ordem", { ascending: true }));
  var resVisitas = await buscarSeguro(banco.from("visitas").select("*").order("data", { ascending: false }).limit(3000));

  var html = "";
  if(!resVideos.ok) html += faixaAviso("Não consegui carregar a tabela de vídeos. Confira se ela existe no seu Supabase (veja o arquivo banco.sql).", "erro");
  if(!resVisitas.ok) html += faixaAviso("Não consegui carregar a tabela de visitas. Confira se ela existe no seu Supabase (veja o arquivo banco.sql).", "erro");

  var videos = resVideos.dados;
  var visitas = resVisitas.dados;

  // ---- métricas da faixa superior ----
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var ha14dias = new Date(hoje.getTime() - 13*86400000);

  var visitas14 = visitas.filter(function(v){ return new Date(v.data) >= ha14dias; });
  var visitasHoje = visitas.filter(function(v){ var d = new Date(v.data); return d >= hoje; });
  var videosNoAr = videos.filter(function(v){ return v.visivel; }).length;

  var contagemNicho = {};
  videos.filter(function(v){ return v.visivel; }).forEach(function(v){
    if(!v.nicho) return;
    contagemNicho[v.nicho] = (contagemNicho[v.nicho] || 0) + 1;
  });
  var nichoMaisForte = "-";
  var maiorNicho = 0;
  Object.keys(contagemNicho).forEach(function(n){
    if(contagemNicho[n] > maiorNicho){ maiorNicho = contagemNicho[n]; nichoMaisForte = n; }
  });

  var contagemOrigem = {};
  visitas.forEach(function(v){
    var origem = v.origem && v.origem.trim() ? v.origem.trim() : "Direto";
    contagemOrigem[origem] = (contagemOrigem[origem] || 0) + 1;
  });
  var origemTop = "-";
  var maiorOrigem = 0;
  Object.keys(contagemOrigem).forEach(function(o){
    if(contagemOrigem[o] > maiorOrigem){ maiorOrigem = contagemOrigem[o]; origemTop = o; }
  });

  html += '<div class="grade-cartoes">' +
    '<div class="cartao"><div class="numero">' + visitas14.length + '</div><div class="rotulo">visitas em 14 dias</div></div>' +
    '<div class="cartao"><div class="numero">' + visitasHoje.length + '</div><div class="rotulo">visitas hoje</div></div>' +
    '<div class="cartao"><div class="numero">' + videosNoAr + '</div><div class="rotulo">vídeos no ar</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.1rem">' + escapa(nichoMaisForte) + '</div><div class="rotulo">nicho mais forte</div></div>' +
    '<div class="cartao"><div class="numero" style="font-size:1.1rem">' + escapa(origemTop) + '</div><div class="rotulo">de onde mais vêm</div></div>' +
    '</div>';

  // ---- gráfico 14 dias + origens ----
  html += '<div class="painel-branco" style="display:grid; grid-template-columns:1.4fr 1fr; gap:24px;" id="blocoGraficos">';
  html += '<div><p class="painel-titulo">Visitas nos últimos 14 dias</p><div id="areaGrafico"></div></div>';
  html += '<div><p class="painel-titulo">De onde as pessoas chegaram</p><div id="areaOrigens"></div></div>';
  html += '</div>';

  // ---- tabela de vídeos ----
  html += '<div class="barra-acoes"><button class="btn btn-principal" id="btnNovoVideo">' + icone("mais") + ' Adicionar vídeo</button></div>';

  if(videos.length === 0){
    html += '<div class="vazio-explicacao">Você ainda não tem vídeos cadastrados. Clique em "Adicionar vídeo" para criar o primeiro.</div>';
  } else {
    html += '<div class="painel-branco"><div class="tabela-scroll"><table><thead><tr>' +
      '<th></th><th>Vídeo</th><th>Nicho</th><th>Marca</th><th>Destaque</th><th>Visível</th><th></th>' +
      '</tr></thead><tbody id="corpoTabelaVideos"></tbody></table></div></div>';
  }

  painel.innerHTML = html;

  // gráfico de barras dos últimos 14 dias
  var areaGrafico = document.getElementById("areaGrafico");
  if(visitas.length === 0){
    areaGrafico.innerHTML = '<p class="vazio-explicacao">Aqui vai aparecer um gráfico assim que as primeiras pessoas visitarem o seu portfólio.</p>';
  } else {
    var dias = [];
    for(var i = 13; i >= 0; i--){
      var d = new Date(hoje.getTime() - i*86400000);
      dias.push(d);
    }
    var maiorContagem = 1;
    var contagensPorDia = dias.map(function(d){
      var proximo = new Date(d.getTime() + 86400000);
      var qtd = visitas.filter(function(v){ var dv = new Date(v.data); return dv >= d && dv < proximo; }).length;
      if(qtd > maiorContagem) maiorContagem = qtd;
      return qtd;
    });
    var svgBarras = '<div class="grafico-barras">';
    dias.forEach(function(d, idx){
      var altura = Math.round((contagensPorDia[idx] / maiorContagem) * 90) + 4;
      svgBarras += '<div class="barra-dia" title="' + contagensPorDia[idx] + ' visita(s)"><div class="barra" style="height:' + altura + 'px"></div><div class="rotulo-dia">' + d.getDate() + '/' + (d.getMonth()+1) + '</div></div>';
    });
    svgBarras += '</div>';
    areaGrafico.innerHTML = svgBarras;
  }

  var areaOrigens = document.getElementById("areaOrigens");
  if(visitas.length === 0){
    areaOrigens.innerHTML = '<p class="vazio-explicacao">Assim que houver visitas, elas vão aparecer aqui agrupadas por origem.</p>';
  } else {
    var listaOrigens = Object.keys(contagemOrigem).map(function(o){ return { origem: o, qtd: contagemOrigem[o] }; });
    listaOrigens.sort(function(a,b){ return b.qtd - a.qtd; });
    var htmlOrigens = "";
    listaOrigens.slice(0, 8).forEach(function(o){
      htmlOrigens += '<div style="display:flex; justify-content:space-between; padding:5px 0; font-size:.8rem; border-bottom:1px solid #f1ecdf;"><span>' + escapa(o.origem) + '</span><strong>' + o.qtd + '</strong></div>';
    });
    areaOrigens.innerHTML = htmlOrigens;
  }

  // tabela de vídeos
  if(videos.length > 0){
    var corpo = document.getElementById("corpoTabelaVideos");
    videos.forEach(function(v){
      var tr = el(
        '<tr draggable="false" data-id="' + v.id + '">' +
          '<td><span class="alcinha" title="Arraste para reordenar">' + icone("alca") + '</span></td>' +
          '<td><strong>' + escapa(v.titulo) + '</strong><br><span style="color:#8a8272;font-size:.7rem;">' + escapa(v.formato || "") + '</span></td>' +
          '<td>' + escapa(v.nicho) + '</td>' +
          '<td>' + escapa(v.marca || "-") + '</td>' +
          '<td>' + escapa(v.destaque || "-") + '</td>' +
          '<td><button class="icone-olho" data-acao="visivel" title="Mostrar ou esconder do site">' + icone(v.visivel ? "olhoAberto" : "olhoFechado") + '</button></td>' +
          '<td><div class="acoes-linha">' +
            '<button class="btn btn-icone" data-acao="editar" title="Editar">' + icone("editar") + '</button>' +
            '<button class="btn btn-icone btn-perigo" data-acao="apagar" title="Apagar">' + icone("lixeira") + '</button>' +
          '</div></td>' +
        '</tr>'
      );

      tr.querySelector('[data-acao="visivel"]').addEventListener("click", async function(){
        var res = await buscarSeguro(banco.from("videos").update({ visivel: !v.visivel }).eq("id", v.id).select());
        if(res.ok) irParaAba("portfolio");
      });
      tr.querySelector('[data-acao="editar"]').addEventListener("click", function(){ abrirFormVideo(v); });
      tr.querySelector('[data-acao="apagar"]').addEventListener("click", function(){ confirmarApagarVideo(v); });

      var alca = tr.querySelector(".alcinha");
      alca.addEventListener("mousedown", function(){ tr.draggable = true; });
      alca.addEventListener("touchstart", function(){ tr.draggable = true; }, { passive: true });
      tr.addEventListener("dragend", function(){ tr.draggable = false; tr.classList.remove("arrastando"); });
      tr.addEventListener("dragstart", function(e){
        tr.classList.add("arrastando");
        e.dataTransfer.setData("text/plain", String(v.id));
      });
      tr.addEventListener("dragover", function(e){ e.preventDefault(); });
      tr.addEventListener("drop", async function(e){
        e.preventDefault();
        var idArrastado = e.dataTransfer.getData("text/plain");
        if(String(idArrastado) === String(v.id)) return;
        await reordenarVideos(idArrastado, v.id, videos);
      });

      corpo.appendChild(tr);
    });
  }

  document.getElementById("btnNovoVideo").addEventListener("click", function(){ abrirFormVideo(null); });
}

async function reordenarVideos(idArrastadoTexto, idAlvo, videosAtuais){
  var idArrastado = Number(idArrastadoTexto);
  var lista = videosAtuais.slice();
  var indiceOrigem = lista.findIndex(function(v){ return v.id === idArrastado; });
  var indiceDestino = lista.findIndex(function(v){ return v.id === idAlvo; });
  if(indiceOrigem === -1 || indiceDestino === -1) return;

  var item = lista.splice(indiceOrigem, 1)[0];
  lista.splice(indiceDestino, 0, item);

  for(var i = 0; i < lista.length; i++){
    await buscarSeguro(banco.from("videos").update({ ordem: i + 1 }).eq("id", lista[i].id));
  }
  irParaAba("portfolio");
}

function abrirFormVideo(video){
  var editando = !!video;
  var opcoesNicho = NICHOS_VIDEO.map(function(n){
    var selecionado = editando && video.nicho === n ? "selected" : "";
    return '<option value="' + n + '" ' + selecionado + '>' + n + '</option>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">' + (editando ? "Editar vídeo" : "Adicionar vídeo") + '</p>' +
    '<form id="formVideo">' +
      '<div class="campo"><label>Título</label><input required id="fvTitulo" value="' + (editando ? escapa(video.titulo) : "") + '"></div>' +
      '<div class="campo"><label>Link do vídeo</label><input required id="fvLink" value="' + (editando ? escapa(video.link) : "") + '"></div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Nicho</label><select id="fvNicho">' + opcoesNicho + '</select></div>' +
        '<div class="campo"><label>Formato</label><input id="fvFormato" placeholder="vídeo vertical 9:16" value="' + (editando ? escapa(video.formato) : "") + '"></div>' +
      '</div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Marca</label><input id="fvMarca" value="' + (editando ? escapa(video.marca || "") : "") + '"></div>' +
        '<div class="campo"><label>Duração (ex: 00:32)</label><input id="fvDuracao" value="' + (editando ? escapa(video.duracao || "") : "") + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Legenda (linha curta explicando o vídeo)</label><input id="fvLegenda" placeholder="Vídeo de 30s pra anúncio, com três ganchos." value="' + (editando ? escapa(video.legenda || "") : "") + '"></div>' +
      '<div class="campo"><label>Destaque (ex: 2,4M views, opcional)</label><input id="fvDestaque" value="' + (editando ? escapa(video.destaque || "") : "") + '"></div>' +
      '<div class="campo campo-check"><input type="checkbox" id="fvVisivel" ' + (!editando || video.visivel ? "checked" : "") + '><label for="fvVisivel">Visível no site</label></div>' +
      '<div class="form-acoes">' +
        '<span></span>' +
        '<button type="submit" class="btn btn-principal">Salvar</button>' +
      '</div>' +
      '<p class="aviso erro oculto" id="fvErro"></p>' +
    '</form>'
  );

  document.getElementById("formVideo").addEventListener("submit", async function(e){
    e.preventDefault();
    var dados = {
      titulo: document.getElementById("fvTitulo").value.trim(),
      link: document.getElementById("fvLink").value.trim(),
      nicho: document.getElementById("fvNicho").value,
      formato: document.getElementById("fvFormato").value.trim(),
      marca: document.getElementById("fvMarca").value.trim(),
      duracao: document.getElementById("fvDuracao").value.trim(),
      legenda: document.getElementById("fvLegenda").value.trim(),
      destaque: document.getElementById("fvDestaque").value.trim(),
      visivel: document.getElementById("fvVisivel").checked
    };

    var res;
    if(editando){
      res = await buscarSeguro(banco.from("videos").update(dados).eq("id", video.id));
    } else {
      var maiorOrdem = await buscarSeguro(banco.from("videos").select("ordem").order("ordem", { ascending: false }).limit(1));
      dados.ordem = (maiorOrdem.ok && maiorOrdem.dados[0] ? maiorOrdem.dados[0].ordem : 0) + 1;
      res = await buscarSeguro(banco.from("videos").insert(dados));
    }

    if(!res.ok){
      var erroEl = document.getElementById("fvErro");
      erroEl.textContent = "Não consegui salvar: " + res.mensagem;
      erroEl.classList.remove("oculto");
      return;
    }
    fecharModal();
    irParaAba("portfolio");
  });
}

function confirmarApagarVideo(video){
  abrirModal(
    '<p class="form-titulo">Apagar vídeo</p>' +
    '<p style="font-size:.85rem; margin-bottom:18px;">Tem certeza que quer apagar "' + escapa(video.titulo) + '"? Essa ação não pode ser desfeita.</p>' +
    '<div class="form-acoes"><button class="btn" id="btnCancelarApagar">Cancelar</button><button class="btn btn-perigo" id="btnConfirmarApagar">Apagar</button></div>'
  );
  document.getElementById("btnCancelarApagar").addEventListener("click", fecharModal);
  document.getElementById("btnConfirmarApagar").addEventListener("click", async function(){
    await buscarSeguro(banco.from("videos").delete().eq("id", video.id));
    fecharModal();
    irParaAba("portfolio");
  });
}

var filtroMarcaSituacao = "todas";
var buscaMarcaTexto = "";

async function abaMarcas(painel){
  var res = await buscarSeguro(banco.from("marcas").select("*").order("criado_em", { ascending: false }));

  var html = "";
  if(!res.ok) html += faixaAviso("Não consegui carregar a tabela de marcas. Confira se ela existe no seu Supabase (veja o arquivo banco.sql).", "erro");

  html += '<div class="barra-acoes">' +
    '<div class="campo-busca">' + icone("busca") + '<input id="buscaMarcas" placeholder="Buscar por nome, @ ou e-mail" value="' + escapa(buscaMarcaTexto) + '"></div>' +
    '<div class="chips" id="chipsSituacao"></div>' +
    '<button class="btn" id="btnBaixarMarcas">' + icone("baixar") + ' Baixar CSV</button>' +
    '<button class="btn btn-principal" id="btnNovaMarca">' + icone("mais") + ' Adicionar</button>' +
  '</div>';

  html += '<div class="barra-acoes" style="margin-bottom:10px;">' +
    '<span id="textoResumoSelecaoMarcas" style="font-size:.82rem; font-weight:600;"></span>' +
    '<button type="button" class="btn btn-pequeno" id="btnSelecionarVisiveisMarcas">Selecionar visíveis</button>' +
    '<button type="button" class="btn btn-pequeno" id="btnLimparSelecaoMarcas">Limpar seleção</button>' +
  '</div>';

  html += '<div class="painel-branco"><div class="tabela-scroll" id="areaTabelaMarcas"></div></div>';

  painel.innerHTML = html;

  var chipsSituacao = document.getElementById("chipsSituacao");
  var opcoesChip = [{ valor: "todas", rotulo: "Todas" }].concat(SITUACOES.map(function(s){ return { valor: s.valor, rotulo: s.rotulo }; }));
  opcoesChip.forEach(function(op){
    var chip = el('<button type="button" class="chip ' + (filtroMarcaSituacao === op.valor ? "ativo" : "") + '">' + op.rotulo + '</button>');
    chip.addEventListener("click", function(){ filtroMarcaSituacao = op.valor; irParaAba("marcas"); });
    chipsSituacao.appendChild(chip);
  });

  document.getElementById("buscaMarcas").addEventListener("input", function(e){
    buscaMarcaTexto = e.target.value;
    desenharTabelaMarcas(res.dados);
  });

  document.getElementById("btnNovaMarca").addEventListener("click", function(){ abrirFormMarca(null); });
  document.getElementById("btnBaixarMarcas").addEventListener("click", function(){
    var lista = filtrarMarcas(res.dados);
    baixarCSV("marcas.csv",
      ["Marca", "Instagram", "E-mail", "Telefone", "Situação", "Observação", "Último contato"],
      lista.map(function(m){
        return [m.nome, m.instagram || "", m.email || "", m.telefone || "", rotuloSituacao(m.situacao), m.obs || "", m.ultimo_contato ? formatarData(m.ultimo_contato) : ""];
      })
    );
  });

  document.getElementById("btnSelecionarVisiveisMarcas").addEventListener("click", async function(){
    var alvo = filtrarMarcas(res.dados).filter(function(m){ return m.email && m.email.trim(); });
    if(alvo.length === 0) return;
    var idsAlvo = alvo.map(function(m){ return m.id; });
    var r = await buscarSeguro(banco.from("marcas").update({ selecionada: true }).in("id", idsAlvo));
    if(r.ok) irParaAba("marcas");
  });
  document.getElementById("btnLimparSelecaoMarcas").addEventListener("click", async function(){
    var selecionadas = res.dados.filter(function(m){ return m.selecionada; });
    if(selecionadas.length === 0) return;
    var idsSelecionados = selecionadas.map(function(m){ return m.id; });
    var r = await buscarSeguro(banco.from("marcas").update({ selecionada: false }).in("id", idsSelecionados));
    if(r.ok) irParaAba("marcas");
  });

  atualizarResumoSelecaoMarcas(res.dados);
  desenharTabelaMarcas(res.dados);
}

function atualizarResumoSelecaoMarcas(todasMarcas){
  var span = document.getElementById("textoResumoSelecaoMarcas");
  if(!span) return;
  var qtd = todasMarcas.filter(function(m){ return m.selecionada; }).length;
  span.textContent = qtd === 1 ? "1 marca selecionada" : qtd + " marcas selecionadas";
}

function rotuloSituacao(valor){
  var s = SITUACOES.find(function(s){ return s.valor === valor; });
  return s ? s.rotulo : valor;
}

function filtrarMarcas(lista){
  return lista.filter(function(m){
    if(filtroMarcaSituacao !== "todas" && m.situacao !== filtroMarcaSituacao) return false;
    if(!buscaMarcaTexto) return true;
    var alvo = (m.nome + " " + (m.instagram||"") + " " + (m.email||"")).toLowerCase();
    return alvo.indexOf(buscaMarcaTexto.toLowerCase()) !== -1;
  });
}

function desenharTabelaMarcas(todasMarcas){
  var area = document.getElementById("areaTabelaMarcas");
  var lista = filtrarMarcas(todasMarcas);

  if(todasMarcas.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Você ainda não tem nenhuma marca cadastrada. Elas também chegam sozinhas aqui quando alguém preenche o formulário de contato do seu portfólio.</div>';
    return;
  }
  if(lista.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Nenhuma marca encontrada com esse filtro.</div>';
    return;
  }

  var tabela = el('<table><thead><tr><th></th><th>Marca</th><th>Instagram</th><th>E-mail</th><th>Telefone</th><th>Situação</th><th>Último contato</th><th></th></tr></thead><tbody></tbody></table>');
  var corpo = tabela.querySelector("tbody");

  lista.forEach(function(m){
    var s = SITUACOES.find(function(s){ return s.valor === m.situacao; }) || SITUACOES[0];
    var linkW = linkWhatsapp(m.telefone);
    var linkI = linkInstagram(m.instagram);
    var temEmail = !!(m.email && m.email.trim());

    var tr = el(
      '<tr class="clicavel">' +

   ABA: PROSPECÇÃO
   Sua base de prospecção ativa: marcas que você vai atrás para oferecer
   parceria. Guardada na tabela "prospeccao" (diferente da tabela "marcas",

var filtroProspStatus = "todos";
var filtroProspNicho = "todos";
var filtroProspOrigem = "todos";
var buscaProspTexto = "";

function valoresUnicos(lista, campo){
  var vistos = {};
  var resultado = [];
  lista.forEach(function(item){
    var v = (item[campo] || "").trim();
    if(!v || vistos[v]) return;
    vistos[v] = true;
    resultado.push(v);
  });
  resultado.sort();
  return resultado;
}

function atualizarResumoSelecaoProsp(todas){
  var span = document.getElementById("textoResumoSelecaoProsp");
  if(!span) return;

  span.textContent = qtd === 1 ? "1 marca selecionada" : qtd + " marcas selecionadas";
}

function filtrarProspeccao(lista){
  return lista.filter(function(m){
    if(filtroProspStatus !== "todos" && m.status !== filtroProspStatus) return false;
    if(filtroProspNicho !== "todos" && (m.nicho || "") !== filtroProspNicho) return false;
    if(filtroProspOrigem !== "todos" && (m.origem || "") !== filtroProspOrigem) return false;
    if(!buscaProspTexto) return true;
    var alvo = (m.nome + " " + (m.instagram||"") + " " + (m.email||"")).toLowerCase();
    return alvo.indexOf(buscaProspTexto.toLowerCase()) !== -1;
  });
}

/* ---------- importação de planilha (CSV ou Excel .xlsx) ---------- */
var CAMPOS_PROSPECCAO_IMPORTAVEIS = [
  { chave: "", rotulo: "Não importar esta coluna" },
  { chave: "nome", rotulo: "Nome" },
  { chave: "site", rotulo: "Site" },
  { chave: "instagram", rotulo: "Instagram" },
  { chave: "seguidores", rotulo: "Seguidores" },
  { chave: "email", rotulo: "E-mail" },
  { chave: "whatsapp", rotulo: "WhatsApp" },
  { chave: "contato", rotulo: "Pessoa de contato" },
  { chave: "nicho", rotulo: "Nicho" },
  { chave: "origem", rotulo: "Origem" },
  { chave: "status", rotulo: "Status" },
  { chave: "observacao", rotulo: "Observação" },
  { chave: "data", rotulo: "Data" }
];

// Cada planilha vem com nomes de coluna diferentes (ex: "Nome da empresa" em
// vez de "Nome"). Em vez de exigir o nome exato, chutamos o campo mais
// provável pelo que aparece no texto do cabeçalho — e a pessoa confirma ou
// troca na tela de importação antes de qualquer coisa ser gravada.
var REGRAS_CABECALHO_PROSPECCAO = [
  { campo: "nome", teste: /nome|marca|empresa|loja/ },
  { campo: "instagram", teste: /instagram/ },
  { campo: "seguidores", teste: /seguidor/ },
  { campo: "whatsapp", teste: /whatsapp|telefone|celular|\bfone\b/ },
  { campo: "email", teste: /e-?mail/ },
  { campo: "contato", teste: /pessoa.*contato|contato.*pessoa|respons[aá]vel/ },
  { campo: "nicho", teste: /nicho|segmento|categoria/ },
  { campo: "origem", teste: /origem|onde.*encontr|\bfonte\b/ },
  { campo: "status", teste: /^status$|situac/ },
  { campo: "observacao", teste: /observa|coment[aá]rio|\bnota\b/ },
  { campo: "data", teste: /\bdata\b/ },
  { campo: "site", teste: /\bsite\b|website|p[aá]gina|\blink\b|produto|\burl\b/ }
];

function sugerirCampoCabecalho(textoOriginal){
  var norm = normalizarTextoCSV(textoOriginal);
  for(var i = 0; i < REGRAS_CABECALHO_PROSPECCAO.length; i++){
    if(REGRAS_CABECALHO_PROSPECCAO[i].teste.test(norm)) return REGRAS_CABECALHO_PROSPECCAO[i].campo;
  }
  return "";
}

function normalizarTextoCSV(texto){
  return String(texto || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .trim();
}

// Lê um texto CSV inteiro e devolve uma matriz de linhas x colunas, tratando
// aspas (campos com vírgula/ponto e vírgula dentro) e detectando sozinho se
// o separador é ";" (padrão do Excel em PT-BR) ou "," (padrão internacional).
function analisarCSV(texto){
  var t = texto.charCodeAt(0) === 0xFEFF ? texto.slice(1) : texto;
  var primeiraLinha = t.split(/\r?\n/, 1)[0] || "";
  var separador = primeiraLinha.split(";").length >= primeiraLinha.split(",").length ? ";" : ",";

  var linhas = [];
  var linhaAtual = [];
  var campoAtual = "";
  var dentroDeAspas = false;
  var i = 0;

  while(i < t.length){
    var c = t[i];
    if(dentroDeAspas){
      if(c === '"'){
        if(t[i+1] === '"'){ campoAtual += '"'; i += 2; continue; }
        dentroDeAspas = false; i++; continue;
      }
      campoAtual += c; i++; continue;
    }
    if(c === '"'){ dentroDeAspas = true; i++; continue; }
    if(c === separador){ linhaAtual.push(campoAtual); campoAtual = ""; i++; continue; }
    if(c === "\r"){ i++; continue; }
    if(c === "\n"){
      linhaAtual.push(campoAtual); campoAtual = "";
      linhas.push(linhaAtual); linhaAtual = [];
      i++; continue;
    }
    campoAtual += c; i++;
  }
  linhaAtual.push(campoAtual);
  if(linhaAtual.length > 1 || linhaAtual[0] !== "") linhas.push(linhaAtual);

  return linhas.filter(function(l){ return l.length > 1 || (l[0] && l[0].trim() !== ""); });
}

function converterDataCSV(texto){
  texto = String(texto || "").trim();
  if(!texto) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;
  var m = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  return null;
}

function converterStatusCSV(texto){
  var norm = normalizarTextoCSV(texto).replace(/\s+/g, "_");
  var encontrado = STATUS_PROSPECCAO.find(function(s){
    return s.valor === norm || normalizarTextoCSV(s.rotulo).replace(/\s+/g, "_") === norm;
  });
  return encontrado ? encontrado.valor : "a_enviar";
}

// Numa planilha Excel, uma célula de data "de verdade" chega aqui como um
// objeto Date (não como texto). Convertemos pela data local (ano/mês/dia),
// nunca por UTC, pra não cair um dia antes ou depois.
function converterCelulaData(bruto){
  if(bruto instanceof Date){
    var ano = bruto.getFullYear();
    var mes = String(bruto.getMonth() + 1).padStart(2, "0");
    var dia = String(bruto.getDate()).padStart(2, "0");
    return ano + "-" + mes + "-" + dia;
  }
  return converterDataCSV(bruto);
}

// Recebe só as linhas de DADOS (sem o cabeçalho) mais o mapeamento coluna→campo
// já confirmado pela pessoa, e devolve os registros prontos para inserir na
// tabela "prospeccao".
function registrosDeLinhas(linhasDados, cabecalho){
  var registros = [];
  linhasDados.forEach(function(linha){
    var obj = {};
    cabecalho.forEach(function(chave, idx){
      if(!chave) return;
      var bruto = linha[idx];
      if(chave === "data"){ obj.data = converterCelulaData(bruto); return; }
      var valor = (bruto === null || bruto === undefined ? "" : String(bruto)).trim();
      if(chave === "status") obj.status = converterStatusCSV(valor);
      else obj[chave] = valor;
    });
    if(obj.nome && obj.nome.trim()) registros.push(obj);
  });
  return registros;
}

// Mostra uma linha de cabeçalho por coluna encontrada na planilha, com o
// campo da prospecção que a gente já chutou pra ela (dá pra trocar antes
// de importar). Só depois de confirmar aqui é que algo é gravado no banco.
function processarLinhasImportadas(linhas){
  if(linhas.length < 2){
    mostrarErroImportacao("Não encontrei linhas para importar nesse arquivo. Confira se a planilha tem uma linha de cabeçalho e pelo menos uma linha de dados.");
    return;
  }

  var cabecalhoOriginal = linhas[0];
  var linhasDados = linhas.slice(1);

  var htmlColunas = cabecalhoOriginal.map(function(textoColuna, idx){
    var sugestao = sugerirCampoCabecalho(textoColuna);
    var opcoes = CAMPOS_PROSPECCAO_IMPORTAVEIS.map(function(c){
      return '<option value="' + c.chave + '" ' + (c.chave === sugestao ? "selected" : "") + '>' + c.rotulo + '</option>';
    }).join("");
    var rotuloColuna = String(textoColuna || "").trim() || ("Coluna " + (idx + 1));
    return '<div class="form-linha" style="align-items:center; margin-bottom:8px;">' +
      '<div style="font-size:.8rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escapa(rotuloColuna) + '">' + escapa(rotuloColuna) + '</div>' +
      '<select class="mapa-coluna" data-idx="' + idx + '">' + opcoes + '</select>' +
    '</div>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">Importar planilha</p>' +
    '<p style="font-size:.85rem; margin-bottom:14px;">Confira se cada coluna da sua planilha caiu no campo certo da prospecção (já deixei um palpite marcado — troque o que precisar) e clique em Importar.</p>' +
    htmlColunas +
    '<p style="font-size:.78rem; color:#8a8272; margin:14px 0;">' + linhasDados.length + ' linha(s) de dados encontradas na planilha.</p>' +
    '<div class="form-acoes"><button class="btn" id="btnCancelarImport">Cancelar</button><button class="btn btn-principal" id="btnConfirmarImport">Importar</button></div>' +
    '<p class="aviso erro oculto" id="fpErroImport"></p>',
    true
  );

  document.getElementById("btnCancelarImport").addEventListener("click", fecharModal);
  document.getElementById("btnConfirmarImport").addEventListener("click", async function(){
    var cabecalho = [];
    modalConteudo.querySelectorAll(".mapa-coluna").forEach(function(sel){
      cabecalho[Number(sel.dataset.idx)] = sel.value || null;
    });

    var erroEl = document.getElementById("fpErroImport");
    if(cabecalho.indexOf("nome") === -1){
      erroEl.textContent = 'Marque alguma coluna como "Nome" — ele é obrigatório para importar cada marca.';
      erroEl.classList.remove("oculto");
      return;
    }

    var registros = registrosDeLinhas(linhasDados, cabecalho);
    if(registros.length === 0){
      erroEl.textContent = 'Nenhuma linha com a coluna "Nome" preenchida foi encontrada.';
      erroEl.classList.remove("oculto");
      return;
    }

    var res = await buscarSeguro(banco.from("prospeccao").insert(registros));
    if(!res.ok){
      erroEl.textContent = "Não consegui importar: " + res.mensagem;
      erroEl.classList.remove("oculto");
      return;
    }
    fecharModal();
    irParaAba("prospeccao");
  });
}

function lerPlanilhaProspeccao(arquivo){
  var nome = arquivo.name || "";
  var ehExcel = /\.xlsx?$/i.test(nome);

  if(ehExcel && !window.XLSX){
    mostrarErroImportacao("Não consegui carregar o componente que lê arquivos .xlsx. Verifique sua internet e tente de novo. Se continuar, salve a planilha como CSV (Arquivo > Salvar como > CSV) e importe o CSV.");
    return;
  }

  var leitor = new FileReader();
  leitor.onload = function(){
    var linhas;
    if(ehExcel){
      var pasta = XLSX.read(leitor.result, { type: "array", cellDates: true });
      var planilha = pasta.Sheets[pasta.SheetNames[0]];
      linhas = XLSX.utils.sheet_to_json(planilha, { header: 1, raw: true, defval: "" });
    } else {
      linhas = analisarCSV(String(leitor.result));
    }
    processarLinhasImportadas(linhas);
  };

  if(ehExcel) leitor.readAsArrayBuffer(arquivo);
  else leitor.readAsText(arquivo, "UTF-8");
}

  var timer = null;
  return function(){

    clearTimeout(timer);
    timer = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

function htmlParaTextoSimplesDisparo(html){
  // Não dá pra só trocar </table>, </p> etc por "\n" direto na string: isso
  // deixa a marcação inválida (tag sem fechar) e o navegador reordena tudo
  // sozinho (o chamado "foster parenting" do parser de HTML). Em vez disso,
  // deixamos o navegador montar a árvore certinha e só then percorremos ela,
  // acrescentando uma quebra de linha depois de cada bloco.
  var origem = document.createElement("div");
  origem.innerHTML = String(html || "").replace(/<br\s*\/?>/gi, "\n");
  var BLOCOS = { P:1, DIV:1, TR:1, LI:1, H1:1, H2:1, H3:1, H4:1, H5:1, H6:1, TABLE:1 };
  var partes = [];
  (function percorrer(node){
    if(node.nodeType === 3){ partes.push(node.nodeValue); return; }
    if(node.nodeType !== 1) return;
    for(var i = 0; i < node.childNodes.length; i++) percorrer(node.childNodes[i]);
    if(BLOCOS[node.tagName]) partes.push("\n");
  })(origem);
  return partes.join("").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}

async function chamarFuncaoEnviarEmails(corpoPedido){

    '<p style="font-size:.85rem; margin-bottom:18px;">Vai enviar para <strong>' + destinatariosFinal.length + ' marca(s)</strong>, da lista "' + escapa(rotuloOrigem) + '". Essa ação não pode ser desfeita.</p>' +
    '<div class="form-acoes"><button class="btn" id="btnCancelarDisparo">Cancelar</button><button class="btn btn-principal" id="btnConfirmarDisparo">Disparar</button></div>'
  );
  document.getElementById("btnCancelarDisparo").addEventListener("click", fecharModal);
  document.getElementById("btnConfirmarDisparo").addEventListener("click", function(){
    fecharModal();
    iniciarDisparoReal(destinatariosFinal, assunto, htmlFinal, rotuloOrigem);
  });
}

async function iniciarDisparoReal(destinatariosFinal, assunto, htmlFinal, rotuloOrigem){
  var TAMANHO_LOTE = 100;
  var total = destinatariosFinal.length;
  var enviadosTotal = 0, falhasTotal = 0, puladosTotal = 0, cotaEsgotada = false;
  var resultadosTotais = [];
  var mensagemErroLote = null;

  var areaProgresso = document.getElementById("areaProgressoDisparo");
  areaProgresso.classList.remove("oculto");
  var barraPreench = document.getElementById("barraProgressoDisparoPreench");
  var textoProgresso = document.getElementById("textoProgressoDisparo");
  document.getElementById("resultadoDisparoArea").innerHTML = "";

  for(var i = 0; i < total; i += TAMANHO_LOTE){
    if(cotaEsgotada) break;
    var lote = destinatariosFinal.slice(i, i + TAMANHO_LOTE).map(function(m){ return { email: m.email, nome: m.nome }; });
    var res = await chamarFuncaoEnviarEmails({ destinatarios: lote, assunto: assunto, html: htmlFinal });
    if(!res.ok){
      mensagemErroLote = res.mensagem;
      break;
    }
    enviadosTotal += res.dados.enviados;
    falhasTotal += res.dados.falhas;
    puladosTotal += res.dados.pulados;
    if(res.dados.cotaEsgotada) cotaEsgotada = true;
    resultadosTotais = resultadosTotais.concat(res.dados.resultados || []);

    var feitos = Math.min(i + TAMANHO_LOTE, total);
    var pct = Math.round((feitos / total) * 100);
    barraPreench.style.width = pct + "%";
    textoProgresso.textContent = feitos + " de " + total;
  }

  var idsOk = {};
  resultadosTotais.forEach(function(r){ if(r.status === "ok") idsOk[r.email] = true; });
  var idsParaMarcar = destinatariosFinal
    .filter(function(m){ return m.id && idsOk[(m.email||"").trim().toLowerCase()]; })
    .map(function(m){ return m.id; });
  if(idsParaMarcar.length > 0){
    await buscarSeguro(banco.from("marcas").update({ ultimo_envio_email: dataDeHojeISO() }).in("id", idsParaMarcar));
  }

  mostrarResumoFinalDisparo({
    enviados: enviadosTotal, falhas: falhasTotal, pulados: puladosTotal,
    cotaEsgotada: cotaEsgotada, origemUsada: rotuloOrigem, origemChave: origemDisparoAtual,
    erroGeral: mensagemErroLote
  });

  atualizarCartoesDisparo();
  atualizarHistoricoDisparo();
}

function mostrarResumoFinalDisparo(info){
  var area = document.getElementById("resultadoDisparoArea");
  var html = '<div class="painel-branco">';
  html += '<p class="painel-titulo">Resultado do disparo</p>';
  html += '<p style="font-size:.85rem; margin-bottom:6px;">Enviados: <strong>' + info.enviados + '</strong> · Falhas: <strong>' + info.falhas + '</strong> · Pulados: <strong>' + info.pulados + '</strong></p>';
  if(info.erroGeral){
    html += faixaAviso("O disparo parou por um erro: " + info.erroGeral, "erro");
  }
  if(info.cotaEsgotada){
    html += faixaAviso("A cota diária do Resend acabou no meio do disparo. Volte amanhã, cole o mesmo assunto e o mesmo texto, deixe marcada a caixinha \"pular quem já recebeu este assunto\" e dispare de novo: só vai mandar pra quem ainda não recebeu.", "erro");
  }
  if(info.origemChave === "selecionadas" && (info.enviados > 0 || info.falhas > 0)){
    html += '<div class="form-acoes" style="margin-top:10px;">' +
      '<span style="font-size:.8rem;">Quer limpar a seleção dessas marcas agora?</span>' +
      '<span><button class="btn btn-pequeno" id="btnNaoLimparSelecaoDisparo">Não</button> <button class="btn btn-pequeno btn-principal" id="btnLimparSelecaoDisparo">Sim, limpar</button></span>' +
    '</div>';
  }
  html += '</div>';
  area.innerHTML = html;

  var btnNao = document.getElementById("btnNaoLimparSelecaoDisparo");
  if(btnNao) btnNao.addEventListener("click", function(){ btnNao.parentElement.parentElement.remove(); });
  var btnSim = document.getElementById("btnLimparSelecaoDisparo");
  if(btnSim) btnSim.addEventListener("click", async function(){
    var selecionadas = cacheMarcasDisparo.filter(function(m){ return m.selecionada; });
    var ids = selecionadas.map(function(m){ return m.id; });
    if(ids.length > 0) await buscarSeguro(banco.from("marcas").update({ selecionada: false }).in("id", ids));
    btnSim.parentElement.parentElement.remove();
  });
}

/* ---------- modo rascunho (sem Resend) ---------- */
function linkGmailComposeDisparo(email, assunto, corpoTexto){
  var params = new URLSearchParams({ view: "cm", fs: "1", to: email, su: assunto, body: corpoTexto });
  return "https://mail.google.com/mail/?" + params.toString();
}

function montarFilaRascunhoDisparo(destinatariosFinal, assunto, corpoTextoBruto, textoBotao, linkBotao){
  filaRascunhoDisparo = destinatariosFinal.map(function(m){
    var corpoPersonalizado = personalizarDisparo(corpoTextoBruto, m.nome);
    if(textoBotao && linkBotao && textoBotao.trim() && linkBotao.trim()){
      corpoPersonalizado += "\n\n" + textoBotao.trim() + ": " + linkBotao.trim();
    }
    return {
      id: m.id,
      email: m.email,
      nomeMarca: m.nome,
      assunto: personalizarDisparo(assunto, m.nome),
      corpoTexto: corpoPersonalizado
    };
  });
  renderizarFilaRascunhoDisparo();
}

function renderizarFilaRascunhoDisparo(){
  var area = document.getElementById("areaFilaRascunhoDisparo");
  if(!area) return;

  if(filaRascunhoDisparo.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Fila vazia. Escolha o destinatário acima e clique em "Montar fila".</div>';
    return;
  }

  var item = filaRascunhoDisparo[0];
  var html = '<div class="painel-branco">';
  html += '<p class="painel-titulo">Próxima: ' + escapa(item.nomeMarca) + ' — faltam ' + filaRascunhoDisparo.length + '</p>';
  html += '<div class="campo"><label>Para</label><input readonly value="' + escapa(item.email) + '"></div>';
  html += '<div class="campo"><label>Assunto</label><input readonly id="assuntoFilaAtual" value="' + escapa(item.assunto) + '"></div>';
  html += '<div class="campo"><label>Texto</label><textarea readonly id="corpoFilaAtual" style="min-height:160px;">' + escapa(item.corpoTexto) + '</textarea></div>';
  html += '<div class="form-acoes">' +
    '<button type="button" class="btn" id="btnCopiarFilaRascunho">' + icone("copiar") + ' Copiar texto</button>' +
    '<span>' +
      '<a class="btn" id="btnAbrirGmailFilaRascunho" href="' + linkGmailComposeDisparo(item.email, item.assunto, item.corpoTexto) + '" target="_blank" rel="noopener">Abrir no Gmail</a> ' +
      '<button type="button" class="btn btn-principal" id="btnMarcarEnviadaFilaRascunho">Marcar como enviada</button>' +
    '</span>' +
  '</div></div>';
  area.innerHTML = html;

  document.getElementById("btnCopiarFilaRascunho").addEventListener("click", async function(){
    try{ await navigator.clipboard.writeText(item.corpoTexto); }catch(e){}
  });
  document.getElementById("btnMarcarEnviadaFilaRascunho").addEventListener("click", async function(){
    if(item.id) await buscarSeguro(banco.from("marcas").update({ ultimo_envio_email: dataDeHojeISO() }).eq("id", item.id));
    filaRascunhoDisparo.shift();
    renderizarFilaRascunhoDisparo();
    atualizarCartoesDisparo();
  });
}

/* ---------- cartões e capa (números ao vivo) ---------- */
async function atualizarCartoesDisparo(){
  var resMarcas = await buscarSeguro(banco.from("marcas").select("*").order("criado_em", { ascending: false }));
  var resEnvios = await buscarSeguro(banco.from("email_envios").select("email, status"));
  var resOptout = await buscarSeguro(banco.from("email_optout").select("email"));

  if(resMarcas.ok) cacheMarcasDisparo = resMarcas.dados;

  var comEmail = cacheMarcasDisparo.filter(function(m){ return temEmailValido(m.email); });
  var aEnviar = comEmail.filter(function(m){ return !m.ultimo_envio_email; });
  var jaReceberam = comEmail.filter(function(m){ return !!m.ultimo_envio_email; });
  var falhas = resEnvios.ok ? resEnvios.dados.filter(function(l){ return l.status === "erro"; }).length : null;
  var descadastrados = resOptout.ok ? resOptout.dados.length : null;

  var cartoes = [
    { numero: comEmail.length, rotulo: "marcas com e-mail", cor: "#2b6fff" },
    { numero: aEnviar.length, rotulo: "a enviar", cor: "#7ea600" },
    { numero: jaReceberam.length, rotulo: "já receberam", cor: "#d99a00" },
    { numero: falhas, rotulo: "falhas", cor: "#1e40af" },
    { numero: descadastrados, rotulo: "descadastrados", cor: "#e5787c" }
  ];
  var areaCartoes = document.getElementById("cartoesDisparo");
  if(areaCartoes){
    areaCartoes.innerHTML = cartoes.map(function(c){
      return '<div class="cartao-borda" style="--cor-cartao:' + c.cor + '">' +
        '<div class="numero">' + (c.numero === null ? "-" : c.numero) + '</div>' +
        '<div class="rotulo">' + c.rotulo + '</div>' +
      '</div>';
    }).join("");
  }

  var totalEnviadosGeral = resEnvios.ok ? resEnvios.dados.filter(function(l){ return l.status === "ok"; }).length : null;
  var numeroCapa = document.getElementById("numeroCapaDisparo");
  if(numeroCapa) numeroCapa.textContent = totalEnviadosGeral === null ? "-" : totalEnviadosGeral;

  var avisos = document.getElementById("avisosDisparo");
  if(avisos){
    var faltando = [];
    if(!resEnvios.ok) faltando.push("email_envios");
    if(!resOptout.ok) faltando.push("email_optout");
    avisos.innerHTML = faltando.length > 0
      ? faixaAviso("Não encontrei a(s) tabela(s) " + faltando.join(", ") + " no Supabase. Cole o arquivo disparo.sql no SQL Editor pra criar. Enquanto isso, os números dessas partes ficam como traço.", "erro")
      : "";
  }
}

var buscaHistoricoDisparo = "";
var cacheHistoricoDisparo = [];

async function atualizarHistoricoDisparo(){
  var res = await buscarSeguro(banco.from("email_envios").select("*").order("criado_em", { ascending: false }).limit(500));
  cacheHistoricoDisparo = res.ok ? res.dados : [];
  desenharHistoricoDisparo();
}

function desenharHistoricoDisparo(){
  var area = document.getElementById("areaTabelaHistoricoDisparo");
  if(!area) return;
  var lista = cacheHistoricoDisparo.filter(function(l){
    if(!buscaHistoricoDisparo) return true;
    return String(l.email || "").toLowerCase().indexOf(buscaHistoricoDisparo.toLowerCase()) !== -1;
  });

  if(cacheHistoricoDisparo.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Nenhum e-mail disparado ainda. Assim que você mandar o primeiro, ele aparece aqui.</div>';
    return;
  }
  if(lista.length === 0){
    area.innerHTML = '<div class="vazio-explicacao">Nenhum envio encontrado com essa busca.</div>';
    return;
  }

  var tabela = el('<table><thead><tr><th>E-mail</th><th>Assunto</th><th>Quando</th><th>Status</th></tr></thead><tbody></tbody></table>');
  var corpo = tabela.querySelector("tbody");
  lista.slice(0, 300).forEach(function(l){
    var cor = l.status === "ok" ? "#7ea600" : "#e5484d";
    var tr = el(
      '<tr' + (l.erro ? ' title="' + escapa(l.erro) + '"' : '') + '>' +
        '<td>' + escapa(l.email) + '</td>' +
        '<td>' + escapa(l.assunto) + '</td>' +
        '<td>' + formatarDataHora(l.criado_em) + '</td>' +
        '<td><span class="pilula" style="background:' + cor + '22; color:' + cor + '">' + (l.status === "ok" ? "Enviado" : "Erro") + '</span></td>' +
      '</tr>'
    );
    corpo.appendChild(tr);
  });
  area.innerHTML = "";
  area.appendChild(tabela);
}

calMesAtual.setDate(1);
var filtroCalTipo = "todos";

function itensDoDia(dataISO, listaCal, listaCamp){
  var itens = [];
  listaCal.forEach(function(c){
    if(c.data !== dataISO) return;
    if(filtroCalTipo !== "todos" && c.tipo !== filtroCalTipo) return;
    itens.push({ tipo: c.tipo, titulo: c.titulo, feito: c.status === "feito", dado: c, ehPrazo: false });
  });
  listaCamp.forEach(function(c){
    if(c.prazo !== dataISO) return;
    itens.push({ tipo: "prazo", titulo: "Prazo: " + c.campanha, feito: c.status === "Entregue", dado: c, ehPrazo: true });
  });
  return itens;
}

function desenharCalendario(listaCal, listaCamp){
  var area = document.getElementById("areaCalGrade");
  var ano = calMesAtual.getFullYear();
  var mes = calMesAtual.getMonth();
  var primeiroDia = new Date(ano, mes, 1);
  var ultimoDia = new Date(ano, mes + 1, 0);

  // segunda = 0 ... domingo = 6
  var offsetInicio = (primeiroDia.getDay() + 6) % 7;

  var celulas = [];
  for(var i = 0; i < offsetInicio; i++){
    var diaAnterior = new Date(ano, mes, 1 - (offsetInicio - i));
    celulas.push({ data: diaAnterior, foraDoMes: true });
  }
  for(var d = 1; d <= ultimoDia.getDate(); d++){
    celulas.push({ data: new Date(ano, mes, d), foraDoMes: false });
  }
  while(celulas.length % 7 !== 0 || celulas.length < 42){
    var ultima = celulas[celulas.length - 1].data;
    var proximo = new Date(ultima);
    proximo.setDate(proximo.getDate() + 1);
    celulas.push({ data: proximo, foraDoMes: true });
    if(celulas.length >= 42) break;
  }

  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var nomesDias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

  var html = '<div class="cal-grade">';
  nomesDias.forEach(function(n){ html += '<div class="cal-dia-semana">' + n + '</div>'; });

  celulas.forEach(function(cel){
    var dataISO = cel.data.getFullYear() + "-" + String(cel.data.getMonth()+1).padStart(2,"0") + "-" + String(cel.data.getDate()).padStart(2,"0");
    var ehHoje = cel.data.getTime() === hoje.getTime();
    var itens = itensDoDia(dataISO, listaCal, listaCamp);

    var classes = "cal-cel" + (cel.foraDoMes ? " fora" : "") + (ehHoje ? " hoje" : "");
    html += '<div class="' + classes + '" data-data="' + dataISO + '">';
    html += '<button class="btn-add-dia" data-add-data="' + dataISO + '" title="Adicionar neste dia">' + icone("mais") + '</button>';
    html += '<span class="num-dia">' + cel.data.getDate() + '</span>';

    itens.slice(0, 3).forEach(function(it){
      var classeTipo = "tipo-" + (it.ehPrazo ? "prazo" : it.tipo);
      html += '<button type="button" class="cal-item ' + classeTipo + (it.feito ? " feito" : "") + '" data-item-data="' + dataISO + '">' + escapa(it.titulo) + '</button>';
    });
    if(itens.length > 3){
      html += '<button type="button" class="cal-mais" data-item-data="' + dataISO + '">+' + (itens.length - 3) + ' mais</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  area.innerHTML = html;

  area.querySelectorAll(".cal-cel").forEach(function(celEl){
    celEl.addEventListener("click", function(e){
      if(e.target.closest(".cal-item") || e.target.closest(".cal-mais") || e.target.closest(".btn-add-dia")) return;
      abrirFormCalendario(null, celEl.dataset.data);
    });
  });
  area.querySelectorAll("[data-add-data]").forEach(function(botao){
    botao.addEventListener("click", function(e){
      e.stopPropagation();
      abrirFormCalendario(null, botao.dataset.addData);
    });
  });
  area.querySelectorAll(".cal-item, .cal-mais").forEach(function(botao){
    botao.addEventListener("click", function(e){
      e.stopPropagation();
      abrirDetalheDia(botao.dataset.itemData, listaCal, listaCamp);
    });
  });
}

function abrirDetalheDia(dataISO, listaCal, listaCamp){
  var itens = itensDoDia(dataISO, listaCal, listaCamp);
  var html = '<p class="form-titulo">' + formatarData(dataISO) + '</p>';
  if(itens.length === 0){
    html += '<p class="vazio-explicacao">Nada marcado neste dia.</p>';
  } else {
    itens.forEach(function(it){
      html += '<div class="item-checklist" style="align-items:center;">' +
        '<div style="flex:1;"><span class="pilula" style="background:#eee;color:#333;">' + (it.ehPrazo ? "Prazo campanha" : rotuloTipoCal(it.tipo)) + '</span> <span style="margin-left:8px;">' + escapa(it.titulo) + '</span></div>' +
        (it.ehPrazo ? '' : '<button class="btn btn-pequeno" data-editar-cal="' + it.dado.id + '">Editar</button>') +
      '</div>';
    });
  }
  html += '<div class="form-acoes"><button class="btn" id="btnFecharDetalheDia">Fechar</button><button class="btn btn-principal" id="btnAddNesteDia">Adicionar aqui</button></div>';

  abrirModal(html);
  document.getElementById("btnFecharDetalheDia").addEventListener("click", fecharModal);
  document.getElementById("btnAddNesteDia").addEventListener("click", function(){ abrirFormCalendario(null, dataISO); });
  modalConteudo.querySelectorAll("[data-editar-cal]").forEach(function(botao){
    botao.addEventListener("click", function(){
      var item = listaCal.find(function(c){ return String(c.id) === botao.dataset.editarCal; });
      if(item) abrirFormCalendario(item, null);
    });
  });
}

function rotuloTipoCal(valor){
  var t = TIPOS_CALENDARIO.find(function(t){ return t.valor === valor; });
  return t ? t.rotulo : valor;
}

function desenharAtrasados(listaCal){
  var area = document.getElementById("areaAtrasados");
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var atrasados = listaCal.filter(function(c){
    return c.status === "a_fazer" && new Date(c.data + "T00:00:00") < hoje;
  }).sort(function(a,b){ return new Date(a.data) - new Date(b.data); });

  if(atrasados.length === 0){
    area.innerHTML = '<p class="vazio-explicacao">Nada atrasado. Tudo em dia por aqui.</p>';
    return;
  }

  area.innerHTML = "";
  atrasados.forEach(function(c){
    var dias = Math.abs(diasEntre(c.data));
    var linha = el(
      '<div class="item-atrasado">' +
        '<span>' + escapa(c.titulo) + (c.marca ? " · " + escapa(c.marca) : "") + '</span>' +
        '<strong>há ' + dias + ' dia' + (dias === 1 ? '' : 's') + '</strong>' +
      '</div>'
    );
    linha.addEventListener("click", function(){ abrirFormCalendario(c, null); });
    linha.style.cursor = "pointer";
    area.appendChild(linha);
  });
}

function abrirFormCalendario(item, dataPreenchida){
  var editando = !!item;
  var opcoesTipo = TIPOS_CALENDARIO.map(function(t){
    var sel = editando && item.tipo === t.valor ? "selected" : "";
    return '<option value="' + t.valor + '" ' + sel + '>' + t.rotulo + '</option>';
  }).join("");

  abrirModal(
    '<p class="form-titulo">' + (editando ? "Editar item" : "Adicionar ao calendário") + '</p>' +
    '<form id="formCal">' +
      '<div class="campo"><label>Título</label><input required id="fcTitulo" value="' + (editando ? escapa(item.titulo) : "") + '"></div>' +
      '<div class="form-linha">' +
        '<div class="campo"><label>Tipo</label><select id="fcTipo">' + opcoesTipo + '</select></div>' +
        '<div class="campo"><label>Data</label><input type="date" required id="fcData" value="' + (editando ? item.data : (dataPreenchida || "")) + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Marca (opcional)</label><input id="fcMarca" value="' + (editando ? escapa(item.marca || "") : "") + '"></div>' +
      '<div class="campo campo-check"><input type="checkbox" id="fcFeito" ' + (editando && item.status === "feito" ? "checked" : "") + '><label for="fcFeito">Já feito</label></div>' +
      '<div class="form-acoes">' +
        (editando ? '<button type="button" class="btn btn-perigo" id="btnApagarCal">Apagar</button>' : '<span></span>') +
        '<button type="submit" class="btn btn-principal">Salvar</button>' +
      '</div>' +
      '<p class="aviso erro oculto" id="fcErro"></p>' +
    '</form>'
  );

  if(editando){
    document.getElementById("btnApagarCal").addEventListener("click", async function(){
      await buscarSeguro(banco.from("calendario").delete().eq("id", item.id));
      fecharModal();
      irParaAba("calendario");
    });
  }

  document.getElementById("formCal").addEventListener("submit", async function(e){
    e.preventDefault();
    var dados = {
      titulo: document.getElementById("fcTitulo").value.trim(),
      tipo: document.getElementById("fcTipo").value,
      data: document.getElementById("fcData").value,
      marca: document.getElementById("fcMarca").value.trim(),
      status: document.getElementById("fcFeito").checked ? "feito" : "a_fazer"
    };
    var res = editando
      ? await buscarSeguro(banco.from("calendario").update(dados).eq("id", item.id))
      : await buscarSeguro(banco.from("calendario").insert(dados));

    if(!res.ok){
      var erroEl = document.getElementById("fcErro");
      erroEl.textContent = "Não consegui salvar: " + res.mensagem;
      erroEl.classList.remove("oculto");
      return;
    }
    fecharModal();
    irParaAba("calendario");
  });
}

var filtroCampanhaStatus = "todas";

      '<button type="button" class="chip ' + (filtroCampanhaStatus === "finalizadas" ? "ativo" : "") + '" data-filtro="finalizadas">Finalizadas</button>' +
    '</div>' +
    '<button class="btn" id="btnBaixarCampanhas">' + icone("baixar") + ' Baixar CSV</button>' +
    '<button class="btn btn-principal" id="btnNovaCampanha">' + icone("mais") + ' Adicionar</button>' +
  '</div>';

  painel.innerHTML = html;

  });
  document.getElementById("buscaCampanhas").addEventListener("input", function(e){

  document.getElementById("btnNovaCampanha").addEventListener("click", function(){ abrirFormCampanha(null); });
  document.getElementById("btnBaixarCampanhas").addEventListener("click", function(){
    var linhas = filtrarOrdenarCampanhas(lista);
